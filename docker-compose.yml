name: investment-os

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: investment_os
      POSTGRES_PASSWORD: investment_os
      POSTGRES_DB: investment_os
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U investment_os]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8-alpine
    command: [redis-server, --appendonly, 'yes']
    volumes:
      - redis-data:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 10

  dsa:
    build:
      context: .
      dockerfile: infra/docker/dsa.Dockerfile
      args:
        DSA_VERSION: ${DSA_VERSION:-contract-stub}
    expose: ['8000']
    healthcheck:
      test:
        [
          CMD,
          python,
          -c,
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')",
        ]
      interval: 5s
      timeout: 3s
      retries: 10

  server:
    build:
      context: .
      dockerfile: infra/docker/server.Dockerfile
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://investment_os:investment_os@postgres:5432/investment_os
      REDIS_URL: redis://redis:6379
      DSA_BASE_URL: http://dsa:8000
      FEISHU_WEBHOOK_URL: ${FEISHU_WEBHOOK_URL:-}
      AI_PROVIDER: ${AI_PROVIDER:-mock}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-mock-v1}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
    ports: ['3000:3000']
    command:
      [
        sh,
        -c,
        'pnpm --filter @investment-os/server prisma migrate deploy && node apps/server/dist/src/main.js',
      ]
    healthcheck:
      test: [CMD, wget, -qO-, http://127.0.0.1:3000/api/v1/health]
      interval: 5s
      timeout: 3s
      retries: 12
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      dsa: { condition: service_healthy }

volumes:
  postgres-data:
  redis-data:
