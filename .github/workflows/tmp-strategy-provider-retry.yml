name: Temporary Strategy Provider Retry
on:
  push:
    branches: [feat/strategy-risk-ai-optimization-20260911]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/strategy-risk-ai-optimization-20260911
      - name: Apply provider retry and concurrency
        run: |
          python <<'PY'
          from pathlib import Path
          p = Path('apps/server/src/strategy-optimization/strategy-optimization-candidate.service.ts')
          text = p.read_text()
          old = "import { StrategyOptimizationRunService } from './strategy-optimization-run.service.js';"
          new = """import {
  isRetriableOptimizationNetworkError,
  optimizationModelConcurrency,
} from './strategy-optimization-concurrency.js';
import { StrategyOptimizationRunService } from './strategy-optimization-run.service.js';"""
          if old not in text: raise SystemExit('import anchor missing')
          text = text.replace(old, new, 1)

          marker = '''  private async completeProposal(
    experiment: ExperimentRow,'''
          helper = '''  private async requestProviderCompletion(
    experiment: ExperimentRow,
    route: { provider: string; model: string },
    modelKey: string,
    messages: unknown[],
    inputTokenReservation: number,
    outputTokenReservation: number,
    estimatedCost: number,
  ) {
    const provider = this.providers.strict(route.provider, route.model);
    const complete = () =>
      optimizationModelConcurrency.withSlot(modelKey, () =>
        provider.complete(
          {
            model: route.model,
            messages,
            tools: [],
            maxOutputTokens: outputTokenReservation,
          },
          AbortSignal.timeout(this.runs.requestTimeoutMs(experiment, 60_000)),
        ),
      );
    try {
      return { provider, completion: await complete(), retryCount: 0 };
    } catch (error) {
      if (!isRetriableOptimizationNetworkError(error)) throw error;
      await this.runs.reserveBudget(experiment.id, {
        aiCalls: 1,
        inputTokens: inputTokenReservation,
        outputTokens: outputTokenReservation,
        estimatedCost,
      });
      return { provider, completion: await complete(), retryCount: 1 };
    }
  }

'''
          if marker not in text: raise SystemExit('completeProposal marker missing')
          text = text.replace(marker, helper + marker, 1)

          old = '''      const provider = this.providers.strict(route.provider, route.model);
      const completion = await provider.complete(
        {
          model: route.model,
          messages,
          tools: [],
          maxOutputTokens: outputTokenReservation,
        },
        AbortSignal.timeout(this.runs.requestTimeoutMs(experiment, 60_000)),
      );'''
          new = '''      const { provider, completion, retryCount } = await this.requestProviderCompletion(
        experiment,
        route,
        modelKey,
        messages,
        inputTokenReservation,
        outputTokenReservation,
        estimatedCost,
      );'''
          if old not in text: raise SystemExit('provider complete block missing')
          text = text.replace(old, new, 1)

          old = '''            round,
            fallbackUsed: false,'''
          new = '''            round,
            retryCount,
            fallbackUsed: false,'''
          if old not in text: raise SystemExit('metadata retry anchor missing')
          text = text.replace(old, new, 1)
          p.write_text(text)
          PY
      - name: Commit
        run: |
          rm .github/workflows/tmp-strategy-provider-retry.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: bound optimization provider retries and concurrency"
          git push origin HEAD:feat/strategy-risk-ai-optimization-20260911
