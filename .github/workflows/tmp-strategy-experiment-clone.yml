name: Temporary Strategy Experiment Clone Completion

on:
  push:
    branches:
      - feat/strategy-risk-ai-optimization-20260911

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/strategy-risk-ai-optimization-20260911
      - name: Implement exposure-aware clone
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str, count: int = 1):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'missing snippet in {path}: {old[:160]!r}')
              p.write_text(text.replace(old, new, count))

          # Schema.
          schema_path = Path('packages/schemas/src/strategy-optimization.ts')
          schema = schema_path.read_text()
          marker = "export const optimizationFinalizeSchema = z\n"
          clone_schema = """export const optimizationExperimentCloneSchema = z\n  .object({\n    idempotencyKey: z.string().trim().min(1).max(200),\n  })\n  .strict();\n\n"""
          if clone_schema not in schema:
              if marker not in schema: raise SystemExit('clone schema insertion marker missing')
              schema = schema.replace(marker, clone_schema + marker, 1)
          type_marker = '''export type OptimizationExperimentCreate = z.infer<typeof optimizationExperimentCreateSchema>;'''
          type_new = '''export type OptimizationExperimentCreate = z.infer<typeof optimizationExperimentCreateSchema>;\nexport type OptimizationExperimentClone = z.infer<typeof optimizationExperimentCloneSchema>;'''
          if type_marker not in schema: raise SystemExit('clone type marker missing')
          schema_path.write_text(schema.replace(type_marker, type_new, 1))

          # Service import + clone implementation.
          replace(
              'apps/server/src/strategy-optimization/strategy-optimization.service.ts',
              '''  optimizationAdoptSchema,\n  optimizationExperimentCreateSchema,\n  optimizationFinalizeSchema,''',
              '''  optimizationAdoptSchema,\n  optimizationExperimentCloneSchema,\n  optimizationExperimentCreateSchema,\n  optimizationFinalizeSchema,''',
          )
          service_path = Path('apps/server/src/strategy-optimization/strategy-optimization.service.ts')
          service = service_path.read_text()
          anchor = '''  async cancel(id: string) {'''
          clone_method = '''  async clone(id: string, input: unknown) {\n    this.assertEnabled();\n    const parsed = optimizationExperimentCloneSchema.parse(input);\n    const previous = await this.prisma.$queryRaw<ExperimentRow[]>(Prisma.sql`\n      SELECT * FROM "OptimizationExperiment" WHERE "idempotencyKey"=${parsed.idempotencyKey} LIMIT 1\n    `);\n    if (previous[0]) return previous[0];\n    const source = await this.experiment(id);\n    const cloneId = randomUUID();\n    const inheritedExposure = source.testExposedAt\n      ? {\n          ...toRecord(source.exposure),\n          inheritedFromExperimentId: source.id,\n          inheritedTestExposure: true,\n          inheritedAt: new Date().toISOString(),\n        }\n      : { inheritedFromExperimentId: source.id, inheritedTestExposure: false };\n    const rows = await this.prisma.$queryRaw<ExperimentRow[]>(Prisma.sql`\n      INSERT INTO "OptimizationExperiment" (\n        "id", "baselineStrategyVersionId", "status", "stage", "objective", "allowedParameterIds",\n        "split", "runConfig", "dataFingerprint", "modelConfig", "budget", "maxRounds",\n        "idempotencyKey", "testExposedAt", "exposure", "updatedAt"\n      ) VALUES (\n        ${cloneId}::uuid, ${source.baselineStrategyVersionId}::uuid, 'queued', 'preparing',\n        ${JSON.stringify(source.objective)}::jsonb, ${JSON.stringify(source.allowedParameterIds)}::jsonb,\n        ${JSON.stringify(source.split)}::jsonb, ${JSON.stringify(source.runConfig)}::jsonb,\n        ${source.dataFingerprint}, ${JSON.stringify(source.modelConfig)}::jsonb,\n        ${JSON.stringify(source.budget)}::jsonb, ${source.maxRounds}, ${parsed.idempotencyKey},\n        ${source.testExposedAt}, ${JSON.stringify(inheritedExposure)}::jsonb, CURRENT_TIMESTAMP\n      ) RETURNING *\n    `);\n    const created = rows[0];\n    if (!created) throw new Error('克隆实验创建失败');\n    void this.process(created.id).catch(() => undefined);\n    return created;\n  }\n\n'''
          if anchor not in service: raise SystemExit('clone service insertion marker missing')
          service_path.write_text(service.replace(anchor, clone_method + anchor, 1))

          # Controller endpoint.
          controller_path = Path('apps/server/src/strategy-optimization/strategy-optimization.controller.ts')
          controller = controller_path.read_text()
          anchor = '''  @Post('experiments/:id/cancel')\n  cancel(@Param('id') id: string) {\n    return this.service.cancel(id);\n  }\n'''
          block = '''  @Post('experiments/:id/clone')\n  clone(@Param('id') id: string, @Body() body: unknown) {\n    return this.service.clone(id, body);\n  }\n\n''' + anchor
          if anchor not in controller: raise SystemExit('clone controller anchor missing')
          controller_path.write_text(controller.replace(anchor, block, 1))

          # Desktop API + button.
          api_path = Path('apps/desktop/src/features/strategy/strategy-optimization.api.ts')
          api = api_path.read_text()
          api_anchor = '''export const cancelOptimizationExperiment = (id: string, client?: DesktopRequestClient) =>\n  jsonPost<OptimizationExperimentSummary>(\n    `/strategy-optimization/experiments/${encodeURIComponent(id)}/cancel`,\n    {},\n    client,\n  );\n'''
          api_block = '''export const cloneOptimizationExperiment = (id: string, client?: DesktopRequestClient) =>\n  jsonPost<OptimizationExperimentSummary>(\n    `/strategy-optimization/experiments/${encodeURIComponent(id)}/clone`,\n    { idempotencyKey: crypto.randomUUID() },\n    client,\n  );\n\n''' + api_anchor
          if api_anchor not in api: raise SystemExit('clone API anchor missing')
          api_path.write_text(api.replace(api_anchor, api_block, 1))

          panel_path = Path('apps/desktop/src/features/strategy/StrategyOptimizationExperimentPanel.tsx')
          panel = panel_path.read_text()
          panel = panel.replace(
              '''  cancelOptimizationExperiment,\n  createOptimizationExperiment,''',
              '''  cancelOptimizationExperiment,\n  cloneOptimizationExperiment,\n  createOptimizationExperiment,''',
              1,
          )
          mutation_anchor = '''  const cancelMutation = useMutation({\n    mutationFn: (id: string) => cancelOptimizationExperiment(id),\n    onSuccess: invalidate,\n  });\n'''
          mutation_block = mutation_anchor + '''  const cloneMutation = useMutation({\n    mutationFn: (id: string) => cloneOptimizationExperiment(id),\n    onSuccess: async (experiment) => {\n      setSelectedExperimentId(experiment.id);\n      setFeedback(\n        experiment.testExposedAt\n          ? '实验已克隆；源实验测试集已暴露，新实验继承该暴露状态，不视为新的独立验证。'\n          : '实验已克隆，并继承相同模型、参数、数据切分与预算配置。',\n      );\n      await invalidate();\n    },\n    onError: (error) => setFeedback(error instanceof Error ? error.message : '克隆实验失败'),\n  });\n'''
          if mutation_anchor not in panel: raise SystemExit('clone mutation anchor missing')
          panel = panel.replace(mutation_anchor, mutation_block, 1)
          panel = panel.replace(
              '''                <Button size="sm" variant="outline" onClick={() => setSelectedExperimentId(experiment.id)}>查看</Button>\n                {!settledStatuses.has(experiment.status) ? <Button size="sm" variant="outline" onClick={() => cancelMutation.mutate(experiment.id)}>取消</Button> : null}''',
              '''                <Button size="sm" variant="outline" onClick={() => setSelectedExperimentId(experiment.id)}>查看</Button>\n                <Button size="sm" variant="outline" disabled={cloneMutation.isPending} onClick={() => cloneMutation.mutate(experiment.id)}>克隆</Button>\n                {!settledStatuses.has(experiment.status) ? <Button size="sm" variant="outline" onClick={() => cancelMutation.mutate(experiment.id)}>取消</Button> : null}''',
              1,
          )
          panel_path.write_text(panel)

          # Schema test: strict clone input.
          test_path = Path('packages/schemas/test/strategy-optimization.test.ts')
          test = test_path.read_text()
          test = test.replace(
              '''  optimizationExperimentCreateSchema,\n  optimizationProposalSchema,''',
              '''  optimizationExperimentCloneSchema,\n  optimizationExperimentCreateSchema,\n  optimizationProposalSchema,''',
              1,
          )
          marker = "\n  it('reserves symmetric model work and final verification before starting', () => {"
          addition = '''\n  it('keeps experiment clone input narrow and idempotent-keyed', () => {\n    expect(optimizationExperimentCloneSchema.parse({ idempotencyKey: 'clone-1' })).toEqual({\n      idempotencyKey: 'clone-1',\n    });\n    expect(() =>\n      optimizationExperimentCloneSchema.parse({ idempotencyKey: 'clone-1', resetExposure: true }),\n    ).toThrow();\n  });\n'''
          if marker not in test: raise SystemExit('clone schema test marker missing')
          test_path.write_text(test.replace(marker, addition + marker, 1))
          PY
      - name: Remove workflow and commit
        shell: bash
        run: |
          rm .github/workflows/tmp-strategy-experiment-clone.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: inherit test exposure when cloning optimization experiments"
          git push origin HEAD:feat/strategy-risk-ai-optimization-20260911
