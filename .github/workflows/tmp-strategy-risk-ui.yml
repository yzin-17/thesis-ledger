name: Temporary Strategy Risk UI Completion

on:
  push:
    branches:
      - feat/strategy-risk-ai-optimization-20260911

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/strategy-risk-ai-optimization-20260911
      - name: Wire RiskCenter and upgrade UI
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str, count: int = 1):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'missing snippet in {path}: {old[:150]!r}')
              p.write_text(text.replace(old, new, count))

          # RiskCenter: expose strategy-origin applications as a first-class tab.
          replace(
              'apps/desktop/src/features/risk/RiskCenter.tsx',
              "import { RiskOverview } from './RiskOverview.js';\nimport { RiskRuleWorkbench } from './RiskRuleWorkbench.js';",
              "import { RiskOverview } from './RiskOverview.js';\nimport { RiskRuleWorkbench } from './RiskRuleWorkbench.js';\nimport { StrategyRiskApplicationsSection } from './StrategyRiskApplicationsSection.js';",
          )
          replace(
              'apps/desktop/src/features/risk/RiskCenter.tsx',
              "type RiskTab = 'overview' | 'rules' | 'events' | 'notifications';",
              "type RiskTab = 'overview' | 'rules' | 'strategy-applications' | 'events' | 'notifications';",
          )
          replace(
              'apps/desktop/src/features/risk/RiskCenter.tsx',
              '''          <TabsTrigger value="rules">规则</TabsTrigger>\n          <TabsTrigger value="events">事件</TabsTrigger>''',
              '''          <TabsTrigger value="rules">规则</TabsTrigger>\n          <TabsTrigger value="strategy-applications">策略应用</TabsTrigger>\n          <TabsTrigger value="events">事件</TabsTrigger>''',
          )
          replace(
              'apps/desktop/src/features/risk/RiskCenter.tsx',
              '''        </TabsContent>\n        <TabsContent value="events">\n          <RiskEventTable''',
              '''        </TabsContent>\n        <TabsContent value="strategy-applications">\n          <StrategyRiskApplicationsSection\n            accounts={accounts}\n            onOpenStrategy={() => void navigate('/strategy?tab=optimization')}\n          />\n        </TabsContent>\n        <TabsContent value="events">\n          <RiskEventTable''',
              1,
          )

          # Strategy route can deep-link directly into the optimization/risk workspace.
          replace(
              'apps/desktop/src/features/strategy/StrategyDashboard.tsx',
              "import { useState } from 'react';",
              "import { useEffect, useState } from 'react';\nimport { useLocation } from 'react-router';",
          )
          replace(
              'apps/desktop/src/features/strategy/StrategyDashboard.tsx',
              '''export function StrategyDashboard() {\n  const [busyAction, setBusyAction] = useState<string | null>(null);''',
              '''export function StrategyDashboard() {\n  const location = useLocation();\n  const [busyAction, setBusyAction] = useState<string | null>(null);''',
          )
          anchor = '''  const [resultJobId, setResultJobId] = useState<string | null>(null);\n  const toastManager = useToastManager();'''
          insert = '''  const [resultJobId, setResultJobId] = useState<string | null>(null);\n  useEffect(() => {\n    const requested = new URLSearchParams(location.search).get('tab');\n    if (requested === 'library' || requested === 'jobs' || requested === 'optimization')\n      setActiveTab(requested);\n  }, [location.search]);\n  const toastManager = useToastManager();'''
          replace('apps/desktop/src/features/strategy/StrategyDashboard.tsx', anchor, insert)

          # Desktop API: explicit upgrade preview + commit.
          api_path = Path('apps/desktop/src/features/strategy/strategy-optimization.api.ts')
          api = api_path.read_text()
          type_anchor = '''export type StrategyRiskApplication = {\n  id: string;'''
          type_insert = '''export type RiskApplicationUpgradePreview = RiskApplicationPreview & {\n  currentRevision: number;\n  diff: Array<{\n    sourceKey: string;\n    before: MonitoringPlan['rules'][number] | null;\n    after: MonitoringPlan['rules'][number] | null;\n    change: 'added' | 'removed' | 'changed' | 'unchanged';\n  }>;\n};\n\nexport type StrategyRiskApplication = {\n  id: string;'''
          if type_anchor not in api: raise SystemExit('API application type anchor missing')
          api = api.replace(type_anchor, type_insert, 1)
          api_append = '''\nexport const previewStrategyRiskApplicationUpgrade = (\n  id: string,\n  targetStrategyVersionId: string,\n  client?: DesktopRequestClient,\n) =>\n  jsonPost<RiskApplicationUpgradePreview>(\n    `/strategy-optimization/risk-applications/${encodeURIComponent(id)}/upgrade-preview`,\n    { targetStrategyVersionId },\n    client,\n  );\n\nexport const upgradeStrategyRiskApplication = (\n  id: string,\n  input: {\n    expectedRevision: number;\n    targetStrategyVersionId: string;\n    previewHash: string;\n    idempotencyKey: string;\n  },\n  client?: DesktopRequestClient,\n) =>\n  jsonPost<StrategyRiskApplication>(\n    `/strategy-optimization/risk-applications/${encodeURIComponent(id)}/upgrade`,\n    input,\n    client,\n  );\n'''
          if 'previewStrategyRiskApplicationUpgrade' not in api:
              api += api_append
          api_path.write_text(api)

          # Risk application panel: compute latest formal version in same strategy and require diff preview + explicit confirmation.
          panel_path = Path('apps/desktop/src/features/strategy/StrategyRiskApplicationPanel.tsx')
          panel = panel_path.read_text()
          panel = panel.replace(
              '''  previewStrategyRiskApplication,\n  updateStrategyRiskApplication,\n  type RiskApplicationPreview,''',
              '''  previewStrategyRiskApplication,\n  previewStrategyRiskApplicationUpgrade,\n  updateStrategyRiskApplication,\n  upgradeStrategyRiskApplication,\n  type RiskApplicationPreview,\n  type RiskApplicationUpgradePreview,''',
              1,
          )
          panel = panel.replace(
              '''  const [preview, setPreview] = useState<RiskApplicationPreview | null>(null);\n  const [feedback, setFeedback] = useState<string | null>(null);''',
              '''  const [preview, setPreview] = useState<RiskApplicationPreview | null>(null);\n  const [upgradePreview, setUpgradePreview] = useState<{\n    applicationId: string;\n    targetStrategyVersionId: string;\n    targetVersion: number;\n    preview: RiskApplicationUpgradePreview;\n  } | null>(null);\n  const [feedback, setFeedback] = useState<string | null>(null);''',
              1,
          )
          mutation_anchor = '''  const toggleMutation = useMutation({\n    mutationFn: (input: { id: string; revision: number; enabled: boolean }) =>\n      updateStrategyRiskApplication(input.id, {\n        expectedRevision: input.revision,\n        enabled: input.enabled,\n      }),\n    onSuccess: async () => {\n      await queryClient.invalidateQueries({ queryKey: riskApplicationKey });\n    },\n    onError: (error) => setFeedback(error instanceof Error ? error.message : '更新风险应用失败'),\n  });\n'''
          mutations = mutation_anchor + '''\n  const upgradePreviewMutation = useMutation({\n    mutationFn: (input: {\n      applicationId: string;\n      targetStrategyVersionId: string;\n      targetVersion: number;\n    }) => previewStrategyRiskApplicationUpgrade(input.applicationId, input.targetStrategyVersionId),\n    onSuccess: (result, input) => {\n      setUpgradePreview({ ...input, preview: result });\n      setFeedback(null);\n    },\n    onError: (error) =>\n      setFeedback(error instanceof Error ? error.message : '风险应用升级预览失败'),\n  });\n\n  const upgradeMutation = useMutation({\n    mutationFn: () => {\n      if (!upgradePreview) throw new Error('请先生成升级预览');\n      return upgradeStrategyRiskApplication(upgradePreview.applicationId, {\n        expectedRevision: upgradePreview.preview.currentRevision,\n        targetStrategyVersionId: upgradePreview.targetStrategyVersionId,\n        previewHash: upgradePreview.preview.previewHash,\n        idempotencyKey: crypto.randomUUID(),\n      });\n    },\n    onSuccess: async (application) => {\n      setUpgradePreview(null);\n      setFeedback(`风险应用已升级到新策略版本，当前修订 r${application.revision}。`);\n      await queryClient.invalidateQueries({ queryKey: riskApplicationKey });\n    },\n    onError: (error) => setFeedback(error instanceof Error ? error.message : '升级风险应用失败'),\n  });\n'''
          if mutation_anchor not in panel: raise SystemExit('toggle mutation anchor missing')
          panel = panel.replace(mutation_anchor, mutations, 1)

          # Replace application list row with source-version-aware upgrade actions and inline diff.
          old_block = '''            {applications.data.map((application) => (\n              <div key={application.id} className="flex flex-wrap items-center justify-between gap-3 rounded-md border p-3">\n                <div>\n                  <div className="font-medium">{application.symbol} · r{application.revision}</div>\n                  <div className="text-xs text-muted-foreground">plan {application.planHash.slice(0, 12)} · {application.plan.rules.length} 条规则</div>\n                </div>\n                <div className="flex items-center gap-2">\n                  <Badge variant={application.enabled ? 'default' : 'outline'}>{application.enabled ? '已启用' : '已停用'}</Badge>\n                  <Button\n                    size="sm"\n                    variant="outline"\n                    disabled={toggleMutation.isPending}\n                    onClick={() => toggleMutation.mutate({ id: application.id, revision: application.revision, enabled: !application.enabled })}\n                  >\n                    {application.enabled ? '停用' : '启用'}\n                  </Button>\n                </div>\n              </div>\n            ))}'''
          new_block = '''            {applications.data.map((application) => {\n              const source = versions.find((entry) => entry.version.id === application.strategyVersionId);\n              const latest = source?.strategy.versions\n                .filter((version) => version.version > 0 && version.schemaVersion === 2)\n                .sort((left, right) => right.version - left.version)[0];\n              const canUpgrade = Boolean(latest && latest.version > (source?.version.version ?? 0));\n              const currentUpgrade =\n                upgradePreview?.applicationId === application.id ? upgradePreview : null;\n              return (\n                <div key={application.id} className="space-y-3 rounded-md border p-3">\n                  <div className="flex flex-wrap items-center justify-between gap-3">\n                    <div>\n                      <div className="flex flex-wrap items-center gap-2">\n                        <span className="font-medium">{application.symbol} · r{application.revision}</span>\n                        <Badge variant="outline">{source ? `${source.strategy.name} · v${source.version.version}` : '策略来源'}</Badge>\n                        {canUpgrade && latest ? <Badge variant="outline">可升级至 v{latest.version}</Badge> : null}\n                      </div>\n                      <div className="mt-1 text-xs text-muted-foreground">plan {application.planHash.slice(0, 12)} · {application.plan.rules.length} 条规则</div>\n                    </div>\n                    <div className="flex flex-wrap items-center gap-2">\n                      <Badge variant={application.enabled ? 'default' : 'outline'}>{application.enabled ? '实际监控中' : '已停用'}</Badge>\n                      {canUpgrade && latest ? (\n                        <Button\n                          size="sm"\n                          variant="outline"\n                          disabled={upgradePreviewMutation.isPending}\n                          onClick={() =>\n                            upgradePreviewMutation.mutate({\n                              applicationId: application.id,\n                              targetStrategyVersionId: latest.id,\n                              targetVersion: latest.version,\n                            })\n                          }\n                        >\n                          预览升级\n                        </Button>\n                      ) : null}\n                      <Button\n                        size="sm"\n                        variant="outline"\n                        disabled={toggleMutation.isPending}\n                        onClick={() => toggleMutation.mutate({ id: application.id, revision: application.revision, enabled: !application.enabled })}\n                      >\n                        {application.enabled ? '停用实际监控' : '启用实际监控'}\n                      </Button>\n                    </div>\n                  </div>\n                  {currentUpgrade ? (\n                    <div className="space-y-2 rounded-md border bg-muted/20 p-3">\n                      <div className="text-sm font-medium">升级到 v{currentUpgrade.targetVersion} 的规则差异</div>\n                      {currentUpgrade.preview.diff\n                        .filter((item) => item.change !== 'unchanged')\n                        .map((item) => (\n                          <div key={item.sourceKey} className="text-xs text-muted-foreground">\n                            {item.change === 'added' ? '新增' : item.change === 'removed' ? '移除' : '修改'} · {item.sourceKey}\n                          </div>\n                        ))}\n                      {currentUpgrade.preview.diff.every((item) => item.change === 'unchanged') ? (\n                        <div className="text-xs text-muted-foreground">监控规则内容没有变化，但来源版本仍会形成新的应用修订。</div>\n                      ) : null}\n                      <div className="flex flex-wrap gap-2">\n                        <Button size="sm" disabled={upgradeMutation.isPending} onClick={() => upgradeMutation.mutate()}>\n                          {upgradeMutation.isPending ? '升级中…' : '确认升级'}\n                        </Button>\n                        <Button size="sm" variant="outline" onClick={() => setUpgradePreview(null)}>取消</Button>\n                      </div>\n                    </div>\n                  ) : null}\n                </div>\n              );\n            })}'''
          if old_block not in panel: raise SystemExit('application map block missing')
          panel_path.write_text(panel.replace(old_block, new_block, 1))
          PY
      - name: Remove workflow and commit
        shell: bash
        run: |
          rm .github/workflows/tmp-strategy-risk-ui.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: complete strategy risk application UI"
          git push origin HEAD:feat/strategy-risk-ai-optimization-20260911
