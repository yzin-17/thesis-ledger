name: Temporary Strategy Optimization Semantics Repair

on:
  push:
    branches:
      - feat/strategy-risk-ai-optimization-20260911

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/strategy-risk-ai-optimization-20260911
      - name: Apply focused semantic fixes
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str, count: int = 1):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'missing snippet in {path}: {old[:120]!r}')
              p.write_text(text.replace(old, new, count))

          # CI test expectation should match the public config validation boundary.
          replace(
              'apps/server/test/ai/configured-providers.test.ts',
              "expect(() => createConfiguredAiProviders(config)).toThrow(/Provider id 必须唯一/);",
              "expect(() => createConfiguredAiProviders(config)).toThrow(/AI_PROVIDER_CONFIGS_JSON 配置无效/);",
          )

          # Persist the only paused phase in V1 orchestration: waiting for user finalization.
          replace(
              'apps/server/prisma/migrations/20260911170000_strategy_risk_ai_optimization/migration.sql',
              '  "backtestRunsUsed" INTEGER NOT NULL DEFAULT 0,\n  "costUsed" DECIMAL(18,8) NOT NULL DEFAULT 0,',
              '  "backtestRunsUsed" INTEGER NOT NULL DEFAULT 0,\n  "pausedDurationMs" INTEGER NOT NULL DEFAULT 0 CHECK ("pausedDurationMs" >= 0),\n  "costUsed" DECIMAL(18,8) NOT NULL DEFAULT 0,',
          )

          replace(
              'apps/server/src/strategy-optimization/strategy-optimization-common.ts',
              '  backtestRunsUsed: number;\n  costUsed: Prisma.Decimal;',
              '  backtestRunsUsed: number;\n  pausedDurationMs: number;\n  costUsed: Prisma.Decimal;',
          )
          replace(
              'apps/server/src/strategy-optimization/strategy-optimization-common.ts',
              "  input: Pick<ExperimentRow, 'createdAt' | 'budget'>,",
              "  input: Pick<ExperimentRow, 'createdAt' | 'pausedDurationMs' | 'budget'>,",
          )
          replace(
              'apps/server/src/strategy-optimization/strategy-optimization-common.ts',
              '  return Math.max(0, maxSeconds * 1_000 - (now - input.createdAt.getTime()));',
              '  const activeElapsedMs = Math.max(0, now - input.createdAt.getTime() - input.pausedDurationMs);\n  return Math.max(0, maxSeconds * 1_000 - activeElapsedMs);',
          )

          replace(
              'apps/server/src/strategy-optimization/strategy-optimization-run.service.ts',
              '''        AND EXTRACT(EPOCH FROM (CURRENT_TIMESTAMP - "createdAt"))\n          <= COALESCE(NULLIF("budget"->>'maxDurationSeconds', '')::int, 1800)''',
              '''        AND (EXTRACT(EPOCH FROM (CURRENT_TIMESTAMP - "createdAt")) * 1000 - "pausedDurationMs")\n          <= COALESCE(NULLIF("budget"->>'maxDurationSeconds', '')::int, 1800) * 1000''',
          )

          # When finalization begins, exclude the user-wait interval since awaiting_finalization was entered.
          replace(
              'apps/server/src/strategy-optimization/strategy-optimization.service.ts',
              '''      SET "status"='testing', "stage"='testing', "lockedCandidateIds"=${JSON.stringify(candidateIds)}::jsonb,\n          "selectedCandidateId"=${selectedCandidateId}::uuid, "leaseUntil"=${new Date(Date.now() + 3_600_000)},\n          "updatedAt"=CURRENT_TIMESTAMP''',
              '''      SET "status"='testing', "stage"='testing', "lockedCandidateIds"=${JSON.stringify(candidateIds)}::jsonb,\n          "selectedCandidateId"=${selectedCandidateId}::uuid, "leaseUntil"=${new Date(Date.now() + 3_600_000)},\n          "pausedDurationMs"="pausedDurationMs" + GREATEST(0, FLOOR(EXTRACT(EPOCH FROM (CURRENT_TIMESTAMP - "updatedAt")) * 1000))::int,\n          "updatedAt"=CURRENT_TIMESTAMP''',
          )
          replace(
              'apps/server/src/strategy-optimization/strategy-optimization.service.ts',
              '''    await this.lockFinalization(experiment, parsed.candidateIds, parsed.selectedCandidateId);\n    try {\n      const fingerprint = await this.finalBaseline(experiment);\n      for (const candidate of candidates) await this.finalCandidate(experiment, candidate, fingerprint);''',
              '''    await this.lockFinalization(experiment, parsed.candidateIds, parsed.selectedCandidateId);\n    try {\n      const testingExperiment = await this.experiment(id);\n      const fingerprint = await this.finalBaseline(testingExperiment);\n      for (const candidate of candidates)\n        await this.finalCandidate(testingExperiment, candidate, fingerprint);''',
          )

          # Compiling a plan is a read-only helper used by AI adoption; the risk-application flag gates mutation/evaluation flows, not compilation.
          replace(
              'apps/server/src/strategy-optimization/strategy-risk-application.service.ts',
              '''  async monitoringPlan(strategyVersionId: string) {\n    this.assertEnabled();\n    const version = await this.strategyVersion(strategyVersionId);''',
              '''  async monitoringPlan(strategyVersionId: string) {\n    const version = await this.strategyVersion(strategyVersionId);''',
          )

          # Extend budget tests to prove user waiting is excluded.
          test_path = Path('apps/server/test/strategy-optimization/strategy-optimization-budget.test.ts')
          test = test_path.read_text()
          test = test.replace(
              "{ createdAt, budget: { maxDurationSeconds: 120 } }",
              "{ createdAt, pausedDurationMs: 0, budget: { maxDurationSeconds: 120 } }",
          )
          insert = '''\n  it('does not count the user finalization wait against compute duration', () => {\n    const createdAt = new Date('2026-09-11T00:00:00.000Z');\n    expect(\n      optimizationRemainingDurationMs(\n        { createdAt, pausedDurationMs: 300_000, budget: { maxDurationSeconds: 120 } },\n        createdAt.getTime() + 330_000,\n      ),\n    ).toBe(90_000);\n  });\n'''
          marker = "\n  it('marks timeout and abort ambiguity as unknown_outcome', () => {"
          if marker not in test: raise SystemExit('budget test insertion marker missing')
          test_path.write_text(test.replace(marker, insert + marker, 1))
          PY
      - name: Remove temporary workflow and commit
        shell: bash
        run: |
          rm .github/workflows/tmp-strategy-optimization-semantics.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: preserve optimization compute budget semantics"
          git push origin HEAD:feat/strategy-risk-ai-optimization-20260911
