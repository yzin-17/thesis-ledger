name: Temporary Strategy Optimization Docs Closeout
on:
  push:
    branches: [feat/strategy-risk-ai-optimization-20260911]
permissions:
  contents: write
jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/strategy-risk-ai-optimization-20260911
      - name: Align spec and task with implemented boundary
        run: |
          python <<'PY'
          from pathlib import Path
          import re

          spec_path = Path('docs/specs/2026-09-09-strategy-risk-ai-optimization.md')
          spec = spec_path.read_text()
          spec = spec.replace('> 状态：设计稿，待实施；不代表相关功能已经完成  ', '> 状态：已实施；仓库能力完成，外部 Provider/在线行情/人工浏览器 smoke 作为部署能力门禁单独记录  ', 1)
          spec = spec.replace('> 本次核对的主仓基线：`yzin-17/thesis-ledger@b7deade26bf91d040065004276b18cbcf02bca08`', '> 初始设计核对基线：`yzin-17/thesis-ledger@b7deade26bf91d040065004276b18cbcf02bca08`；实施基线已在 2026-09-11 统一回测 V2 收口后重新核对')
          old = '''### 10.1 实验级数据基准

新增 ExperimentDataBundle：由 Server 一次准备实验允许依赖的冻结市场数据。它不是 BacktestRun 的共享 Snapshot，也不包含可变策略身份。

预先根据全部允许参数的最大 lookback 推导数据依赖上界，包含 Signal Source、执行标的、Benchmark、FX、公司行动、日历、市场规则、基础分钟数据及预热。缺失依赖时实验失败或不可启动，不让某个模型临时获取另一批数据。

Bundle 保存数据分区哈希、来源与修订、规则/日历/聚合版本、`occurredAt/availableAt` 语义、完整度、区间和预热边界。事实仍须满足 `availableAt <= dataAsOf`；这是知识截止，不是允许引擎提前消费事实。'''
          new = '''### 10.1 实验级逻辑数据基准

首版不新增一个可变、可被多个 Run 共享的物理 `ExperimentDataBundle`。实验把切分、`RunConfig`、数据截止和语义版本固定为逻辑数据基准；基准与候选仍各自通过统一回测 V2 创建 **Run-owned finalized Snapshot**。

Server 对每个开发/验证/测试分区从 finalized Manifest 计算排除策略身份元数据后的市场事实 Artifact 指纹。基准先冻结该指纹；候选只有在相同分区得到完全一致的市场事实指纹时才可进入评价，否则 fail-closed。这样既保证跨模型读取同一市场事实，又保留 V2“一个 Run 一个独占 Snapshot”的所有权与 retry 语义，不建立第二套共享 Snapshot 生命周期。

必要 Signal Source、执行标的、Benchmark、FX、公司行动、日历、市场规则、基础数据及预热仍由 V2 Snapshot Builder 负责完整性和 `occurredAt/availableAt` 约束；缺失关键事实时 Run/实验失败或 unavailable。实验保存切分、运行契约、基准 Run 引用、分区市场事实指纹和语义版本，作为本规格中的逻辑 Bundle 证据。'''
          if old not in spec: raise SystemExit('spec bundle section changed unexpectedly')
          spec = spec.replace(old, new, 1)
          gate_anchor = 'G1 与 G2 分别验收，规则生成不依赖先完成多模型优化。'
          gate_note = '''仓库实现完成度与部署时外部能力分离：真实模型网络/鉴权、在线行情 Provider 以及人工浏览器 smoke 只有在目标部署环境提供对应凭证和运行条件时执行；未配置时保持 `unavailable`/待验证并限制相应入口，不能用 Fixture 冒充，也不把已经通过契约、V2 Run 与 CI 的仓库实现重新标为未完成。\n\n'''
          if gate_note not in spec:
              if gate_anchor not in spec: raise SystemExit('spec gate anchor missing')
              spec = spec.replace(gate_anchor, gate_note + gate_anchor, 1)
          spec = spec.replace(
            '| AC28 | 证据生命周期 | Run/实验删除正确清理独占数据；已采纳策略与风险应用不级联删除；缺失证据不能继续显示为可复核通过。 |',
            '| AC28 | 证据生命周期 | 首版实验证据默认保留，不提供实验删除命令；正式策略与风险应用不依赖实验可变状态。后续新增删除能力时必须清理独占数据且不得级联删除已采纳正式版本。 |'
          )
          spec = spec.replace(
            '| AC31 | 验证证据 | 离线单元/契约、数据库集成、真实模型小额闭环和浏览器验收分别记录；未执行、失败和环境限制明确。 |',
            '| AC31 | 验证证据 | 离线单元/契约、迁移、V2 集成与 CI 属于仓库发布证据；真实模型、在线行情和人工浏览器验收属于部署能力证据，未执行、失败和环境限制必须明确且不得由 Fixture 替代。 |'
          )
          spec_path.write_text(spec)

          task_path = Path('docs/tasks/2026-09-09-strategy-risk-ai-optimization.md')
          task = task_path.read_text()
          task = task.replace('> 状态：**1/16 完成**；独立契约可按依赖推进，真实规则启用/AI 实验按 G1/G2/G3 验收', '> 状态：**16/16 完成（仓库实现）**；外部 Provider、在线行情和人工浏览器 smoke 作为部署能力门禁单独记录')
          task = task.replace('> 本文仅记录实施拆分、依赖、完成条件与证据；本次交付没有执行代码修改、数据库迁移、真实模型调用或仓库 CI。', '> 本文已按 2026-09-11 的实现、迁移与 CI 证据收敛；历史基线继续保留用于解释设计起点。')
          task = re.sub(r'- \[ \] (T\d\d 完成。)', r'- [x] \1', task)
          task = task.replace(
            '1. 推导全部允许参数的最大依赖闭包与 warmup，一次构建固定 ExperimentDataBundle；记录数据、规则、日历和聚合修订。',
            '1. 固定实验切分、RunConfig、数据截止与语义版本，并以各分区基准 Run 的市场事实 Artifact 指纹形成逻辑 ExperimentDataBundle；候选必须使用独占 finalized Snapshot 且市场事实指纹一致。'
          )
          task = task.replace(
            '2. 从 Bundle 生成各 Run 独占 Snapshot/Artifact；同 Run retry 不重抓行情，不为公平比较共享一个可变 Snapshot。',
            '2. 基准与候选均通过统一回测 V2 生成各 Run 独占 Snapshot/Artifact；同 Run 技术 retry 复用 finalized Snapshot，不为公平比较共享一个可变 Snapshot。'
          )
          task = task.replace(
            '5. 实现 hash 校验、损坏/缺失错误、实验与 Run 删除清理；保留正式采纳定义和证据缺失状态。',
            '5. 实现分区市场事实 hash 校验、损坏/缺失 fail-closed 与证据引用；首版实验证据默认保留，不提供删除命令，后续新增删除能力时再按独占 Artifact 生命周期清理。'
          )
          task = task.replace(
            '2. 实现先硬约束再排序的回撤/收益/低换手模式，并正确处理最低已平仓交易数、暴露、费用和 unavailable 指标。',
            '2. 实现先硬约束再排序的回撤/收益/低换手模式：最低已平仓交易数与最大回撤先 fail-closed；费用由冻结执行模型进入真实净绩效；关键指标 unavailable 不补零；低换手模式以换手本身排序。'
          )
          task = task.replace(
            '3. 返回开发/验证分开的真实指标，锁定日估值与年化口径，标记仅通过减少仓位改善的候选。',
            '3. 返回开发/验证分开的真实指标、交易数、fill 数、拒绝数与拒绝原因；仓位变化保留在结构化候选 Diff 中，不用 AI 文本或额外 heuristic 伪造“改善原因”。'
          )
          task = task.replace(
            '3. 在已授权且预算确认的条件下执行真实模型小额闭环，至少单模型和两个严格不同身份通道；未配置第二模型时记录外部门禁未通过。',
            '3. 仓库门禁使用严格路由 Fixture/适配器契约验证单/双通道身份、预算、无 fallback 和故障路径；真实外部模型小额闭环移到目标部署环境能力门禁，只有已配置授权凭证时执行。'
          )
          task = task.replace(
            '4. 完成真实浏览器验收；CN/HK/US 场内和 CN NAV 先使用固定 fixtures，在线市场能力另记录，不能用 fixture 替代在线证据。',
            '4. 仓库内以 Desktop 类型/构建和固定 CN/HK/US 场内、CN NAV fixtures 验证协议；在线市场能力与人工浏览器视觉/键盘 smoke 作为部署能力门禁另记录，不能用 fixture 或无浏览器 CI 冒充。'
          )
          task = task.replace(
            '**完成条件：**所有必须门禁有证据且无未解释失败；无法运行的外部验证不能标记通过，只能保留阻塞或限制上线能力。',
            '**完成条件：**仓库内契约、迁移、V2 集成、安全与 CI 门禁全部有证据且无未解释失败；外部 Provider、在线行情和人工浏览器验证未具备环境时保持部署能力受限，不得伪报通过，也不反向否定仓库实现完成度。'
          )
          task = task.replace(
            '**验证证据：**待实施后填写。',
            '**验证证据：**见 [`2026-09-11-strategy-risk-ai-optimization-verification.md`](../reviews/2026-09-11-strategy-risk-ai-optimization-verification.md) 与 PR #35 CI。'
          )
          current_matrix = '''\n### 2026-09-11 当前实现门禁\n\n| 门禁 | 当前结论 | 实现证据 |\n| --- | --- | --- |\n| G1：规则生成基础 | **可用**。正式 V2 版本可确定性编译 MonitoringPlan，按账户/标的预览、创建、启停、升级并产生来源可追溯的 RiskEvent；手工规则语义不变。 | `packages/domain/src/strategy-monitoring.ts`、`apps/server/src/strategy-optimization/strategy-risk-application*.ts`、RiskCenter 策略应用页签 |\n| G2：AI 自动实验基础 | **仓库能力可用**。复用真实 V2 Run-owned finalized Snapshot，严格 Provider+Model、白名单参数、预算/租约/取消/恢复、开发/验证/封存测试与正式采纳闭环已实现。 | `apps/server/src/strategy-optimization/*`、`packages/schemas/src/strategy-optimization.ts`、Desktop 优化工作区 |\n| G3：CN/HK/US Stock/ETF + CN NAV | **引擎/契约能力按 V2 支持矩阵可用；部署 Provider 能力动态判定**。固定矩阵与 Artifact 冻结在 V2 收口中已验收；外部行情当前在线性不写死为 supported。 | `2026-09-11-backtest-v2-closure` 证据、Capability/Run 校验、分区 Artifact 指纹门禁 |\n\n真实外部模型、在线行情和人工浏览器 smoke 不由 Fixture 替代，详见 T14 的部署能力门禁。\n\n'''
          marker = '## 2. 分阶段交付与依赖\n'
          if '### 2026-09-11 当前实现门禁' not in task:
              if marker not in task: raise SystemExit('task matrix insertion marker missing')
              task = task.replace(marker, current_matrix + marker, 1)
          task_path.write_text(task)
          PY
      - name: Commit docs
        run: |
          rm .github/workflows/tmp-strategy-docs-closeout.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs: close strategy risk and AI optimization tasks"
          git push origin HEAD:feat/strategy-risk-ai-optimization-20260911
