name: AI onboarding source snapshot
on:
  pull_request:
    types: [opened, synchronize]
permissions:
  contents: read
jobs:
  snapshot:
    if: github.head_ref == 'codex/ai-provider-auto-test-save'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: |
          pnpm --filter @thesis-ledger/schemas build
          pnpm --filter @thesis-ledger/shared build
          pnpm --filter @thesis-ledger/domain build
          pnpm --filter @thesis-ledger/api-client build
      - name: Archive tracked source and installed verification dependencies only
        run: |
          git archive --format=tar.gz HEAD -o /tmp/source.tar.gz
          find . -maxdepth 3 -type d \( -name node_modules -o -name dist \) -print0 | tar --null -T - -czf /tmp/verification-deps.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: ai-onboarding-offline-checks
          path: |
            /tmp/source.tar.gz
            /tmp/verification-deps.tar.gz
          retention-days: 1
          compression-level: 0
