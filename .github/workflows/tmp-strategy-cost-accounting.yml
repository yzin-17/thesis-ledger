name: Temporary Strategy Optimization Cost Accounting

on:
  push:
    branches:
      - feat/strategy-risk-ai-optimization-20260911

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/strategy-risk-ai-optimization-20260911
      - name: Make unknown cost explicit
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str, count: int = 1):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'missing snippet in {path}: {old[:160]!r}')
              p.write_text(text.replace(old, new, count))

          # Provider contract and pricing metadata.
          replace(
              'apps/server/src/ai/contracts.ts',
              '''  costPer1kInput?: number;\n  costPer1kOutput?: number;\n}''',
              '''  costPer1kInput?: number;\n  costPer1kOutput?: number;\n  costCurrency?: string;\n  pricingVersion?: string;\n}''',
          )
          replace(
              'apps/server/src/ai/contracts.ts',
              '''  ): Promise<{ content: unknown; inputTokens: number; outputTokens: number; cost: number }>;''',
              '''  ): Promise<{\n    content: unknown;\n    inputTokens: number;\n    outputTokens: number;\n    cost: number;\n    costKnown?: boolean;\n    costCurrency?: string;\n    pricingVersion?: string;\n    actualModel?: string;\n  }>;''',
          )

          adapters_path = Path('apps/server/src/ai/provider-adapters.ts')
          adapters = adapters_path.read_text()
          adapters = adapters.replace(
              '''        timeoutMs: z.number().int().positive().optional(),''',
              '''        timeoutMs: z.number().int().positive().optional(),\n        costPer1kInput: z.number().nonnegative().optional(),\n        costPer1kOutput: z.number().nonnegative().optional(),\n        costCurrency: z.string().trim().min(1).max(16).optional(),\n        pricingVersion: z.string().trim().min(1).max(120).optional(),''',
              1,
          )
          old_ctor = '''  constructor(\n    readonly id: string,\n    readonly models: readonly string[],\n    private readonly baseUrl: string,\n    private readonly apiKey: string,\n    private readonly timeoutMs = 30_000,\n  ) {\n    this.metadata = { baseURL: baseUrl, health: 'unknown' as const, priority: 100 };\n  }'''
          new_ctor = '''  constructor(\n    readonly id: string,\n    readonly models: readonly string[],\n    private readonly baseUrl: string,\n    private readonly apiKey: string,\n    private readonly timeoutMs = 30_000,\n    pricing?: {\n      costPer1kInput?: number;\n      costPer1kOutput?: number;\n      costCurrency?: string;\n      pricingVersion?: string;\n    },\n  ) {\n    this.metadata = {\n      baseURL: baseUrl,\n      health: 'unknown' as const,\n      priority: 100,\n      ...(pricing?.costPer1kInput === undefined ? {} : { costPer1kInput: pricing.costPer1kInput }),\n      ...(pricing?.costPer1kOutput === undefined ? {} : { costPer1kOutput: pricing.costPer1kOutput }),\n      ...(pricing?.costCurrency ? { costCurrency: pricing.costCurrency } : {}),\n      ...(pricing?.pricingVersion ? { pricingVersion: pricing.pricingVersion } : {}),\n    };\n  }'''
          if old_ctor not in adapters: raise SystemExit('OpenAI adapter constructor missing')
          adapters = adapters.replace(old_ctor, new_ctor, 1)
          old_return = '''    return {\n      content: parseContent(message.content),\n      inputTokens: typeof usage?.prompt_tokens === 'number' ? usage.prompt_tokens : 0,\n      outputTokens: typeof usage?.completion_tokens === 'number' ? usage.completion_tokens : 0,\n      cost: 0,\n    };'''
          new_return = '''    const inputTokens = typeof usage?.prompt_tokens === 'number' ? usage.prompt_tokens : 0;\n    const outputTokens = typeof usage?.completion_tokens === 'number' ? usage.completion_tokens : 0;\n    const inputRate = this.metadata.costPer1kInput;\n    const outputRate = this.metadata.costPer1kOutput;\n    const costKnown = typeof inputRate === 'number' && typeof outputRate === 'number';\n    return {\n      content: parseContent(message.content),\n      inputTokens,\n      outputTokens,\n      cost: costKnown ? (inputTokens * inputRate + outputTokens * outputRate) / 1_000 : 0,\n      costKnown,\n      ...(this.metadata.costCurrency ? { costCurrency: this.metadata.costCurrency } : {}),\n      ...(this.metadata.pricingVersion ? { pricingVersion: this.metadata.pricingVersion } : {}),\n      ...(typeof root?.model === 'string' ? { actualModel: root.model } : {}),\n    };'''
          if old_return not in adapters: raise SystemExit('OpenAI adapter return missing')
          adapters = adapters.replace(old_return, new_return, 1)
          adapters = adapters.replace(
              '''        cost: 0,\n      });''',
              '''        cost: 0,\n        costKnown: true,\n        costCurrency: 'FIXTURE',\n        pricingVersion: 'fixture-v1',\n        actualModel: input.model,\n      });''',
              1,
          )
          adapters = adapters.replace(
              '''    return Promise.resolve({ content: result, inputTokens: 0, outputTokens: 0, cost: 0 });''',
              '''    return Promise.resolve({\n      content: result,\n      inputTokens: 0,\n      outputTokens: 0,\n      cost: 0,\n      costKnown: true,\n      costCurrency: 'FIXTURE',\n      pricingVersion: 'fixture-v1',\n      actualModel: input.model,\n    });''',
              1,
          )
          old_provider_input = '''    input.apiKey,\n    input.timeoutMs ?? defaultTimeoutMs,\n  );'''
          new_provider_input = '''    input.apiKey,\n    input.timeoutMs ?? defaultTimeoutMs,\n    {\n      ...(input.costPer1kInput === undefined ? {} : { costPer1kInput: input.costPer1kInput }),\n      ...(input.costPer1kOutput === undefined ? {} : { costPer1kOutput: input.costPer1kOutput }),\n      ...(input.costCurrency ? { costCurrency: input.costCurrency } : {}),\n      ...(input.pricingVersion ? { pricingVersion: input.pricingVersion } : {}),\n    },\n  );'''
          if old_provider_input not in adapters: raise SystemExit('providerFromInput call missing')
          adapters_path.write_text(adapters.replace(old_provider_input, new_provider_input, 1))

          # Experiment creation requires explicit acknowledgement when selected route has unknown pricing.
          replace(
              'packages/schemas/src/strategy-optimization.ts',
              '''    maxRounds: z.number().int().min(1).max(3).default(2),\n    idempotencyKey: z.string().trim().min(1).max(200),''',
              '''    maxRounds: z.number().int().min(1).max(3).default(2),\n    acknowledgeUnknownCost: z.boolean().default(false),\n    idempotencyKey: z.string().trim().min(1).max(200),''',
          )

          service_path = Path('apps/server/src/strategy-optimization/strategy-optimization.service.ts')
          service = service_path.read_text()
          old_caps = '''      providers: this.providers.list().flatMap((provider) =>\n        provider.models.map((model) => ({ provider: provider.id, model })),\n      ),'''
          new_caps = '''      providers: this.providers.list().flatMap((provider) => {\n        const costKnown =\n          typeof provider.metadata?.costPer1kInput === 'number' &&\n          typeof provider.metadata?.costPer1kOutput === 'number';\n        return provider.models.map((model) => ({\n          provider: provider.id,\n          model,\n          costStatus: costKnown ? ('known' as const) : ('unknown' as const),\n          ...(provider.metadata?.costCurrency ? { costCurrency: provider.metadata.costCurrency } : {}),\n          ...(provider.metadata?.pricingVersion ? { pricingVersion: provider.metadata.pricingVersion } : {}),\n        }));\n      }),'''
          if old_caps not in service: raise SystemExit('capabilities provider block missing')
          service = service.replace(old_caps, new_caps, 1)
          old_create = '''    this.candidateService.validateAuthorizedParameters(descriptors, parsed.allowedParameterIds);\n    parsed.models.forEach((route) => this.providers.strict(route.provider, route.model));\n    const created = await this.insertExperiment(parsed, baseline);'''
          new_create = '''    this.candidateService.validateAuthorizedParameters(descriptors, parsed.allowedParameterIds);\n    const modelConfig = parsed.models.map((route) => {\n      const provider = this.providers.strict(route.provider, route.model);\n      const costKnown =\n        typeof provider.metadata?.costPer1kInput === 'number' &&\n        typeof provider.metadata?.costPer1kOutput === 'number';\n      return {\n        ...route,\n        costStatus: costKnown ? ('known' as const) : ('unknown' as const),\n        ...(provider.metadata?.costCurrency ? { costCurrency: provider.metadata.costCurrency } : {}),\n        ...(provider.metadata?.pricingVersion ? { pricingVersion: provider.metadata.pricingVersion } : {}),\n      };\n    });\n    if (modelConfig.some((route) => route.costStatus === 'unknown') && !parsed.acknowledgeUnknownCost)\n      throw new BadRequestException('所选模型存在未知费用；请明确确认费用上限不可保证');\n    const created = await this.insertExperiment(parsed, baseline, modelConfig);'''
          if old_create not in service: raise SystemExit('experiment create model block missing')
          service = service.replace(old_create, new_create, 1)
          old_sig = '''  private async insertExperiment(\n    parsed: ReturnType<typeof optimizationExperimentCreateSchema.parse>,\n    baseline: StrategyVersionRecord & { strategy: StrategySchemaV2 },\n  ) {'''
          new_sig = '''  private async insertExperiment(\n    parsed: ReturnType<typeof optimizationExperimentCreateSchema.parse>,\n    baseline: StrategyVersionRecord & { strategy: StrategySchemaV2 },\n    modelConfig: Array<{\n      provider: string;\n      model: string;\n      costStatus: 'known' | 'unknown';\n      costCurrency?: string;\n      pricingVersion?: string;\n    }>,\n  ) {'''
          if old_sig not in service: raise SystemExit('insertExperiment signature missing')
          service = service.replace(old_sig, new_sig, 1)
          service = service.replace(
              '${JSON.stringify(parsed.runConfig)}::jsonb, ${dataFingerprint}, ${JSON.stringify(parsed.models)}::jsonb,',
              '${JSON.stringify(parsed.runConfig)}::jsonb, ${dataFingerprint}, ${JSON.stringify(modelConfig)}::jsonb,',
              1,
          )
          service_path.write_text(service)

          # Pricing-aware reservation and auditable actual model/cost status.
          candidate_path = Path('apps/server/src/strategy-optimization/strategy-optimization-candidate.service.ts')
          candidate = candidate_path.read_text()
          old_estimate = '''    const modelKey = `${route.provider}:${route.model}`;\n    const estimatedCost = 0;\n    const messages = await this.prompt(experiment, baseline.strategy, descriptors, modelKey, round);\n    const inputTokenReservation = this.runs.conservativeInputTokenReservation(messages);\n    const outputTokenReservation = this.runs.outputTokenReservation(experiment);'''
          new_estimate = '''    const modelKey = `${route.provider}:${route.model}`;\n    const provider = this.providers.strict(route.provider, route.model);\n    const messages = await this.prompt(experiment, baseline.strategy, descriptors, modelKey, round);\n    const inputTokenReservation = this.runs.conservativeInputTokenReservation(messages);\n    const outputTokenReservation = this.runs.outputTokenReservation(experiment);\n    const inputRate = provider.metadata?.costPer1kInput;\n    const outputRate = provider.metadata?.costPer1kOutput;\n    const estimatedCost =\n      typeof inputRate === 'number' && typeof outputRate === 'number'\n        ? (inputTokenReservation * inputRate + outputTokenReservation * outputRate) / 1_000\n        : 0;'''
          if old_estimate not in candidate: raise SystemExit('candidate estimate block missing')
          candidate = candidate.replace(old_estimate, new_estimate, 1)
          candidate = candidate.replace(
              '''            actualProvider: provider.id,\n            requestedModel: route.model,\n            actualModel: route.model,\n            round,\n            fallbackUsed: false,''',
              '''            actualProvider: provider.id,\n            requestedModel: route.model,\n            actualModel: completion.actualModel ?? route.model,\n            costStatus: completion.costKnown === false ? 'unknown' : 'known',\n            ...(completion.costCurrency ? { costCurrency: completion.costCurrency } : {}),\n            ...(completion.pricingVersion ? { pricingVersion: completion.pricingVersion } : {}),\n            round,\n            fallbackUsed: false,''',
              1,
          )
          candidate_path.write_text(candidate)

          # Desktop capabilities and experiment type expose pricing status; creation requires explicit user acknowledgement.
          api_path = Path('apps/desktop/src/features/strategy/strategy-optimization.api.ts')
          api = api_path.read_text()
          api = api.replace(
              '''  providers: Array<{ provider: string; model: string }>;''',
              '''  providers: Array<{\n    provider: string;\n    model: string;\n    costStatus: 'known' | 'unknown';\n    costCurrency?: string;\n    pricingVersion?: string;\n  }>;''',
              1,
          )
          api = api.replace(
              '''  modelConfig: Array<{ provider: string; model: string }>;''',
              '''  modelConfig: Array<{\n    provider: string;\n    model: string;\n    costStatus?: 'known' | 'unknown';\n    costCurrency?: string;\n    pricingVersion?: string;\n  }>;''',
              1,
          )
          api_path.write_text(api)

          panel_path = Path('apps/desktop/src/features/strategy/StrategyOptimizationExperimentPanel.tsx')
          panel = panel_path.read_text()
          panel = panel.replace(
              "  const [maxDurationSeconds, setMaxDurationSeconds] = useState('1800');\n  const [executionModelJson, setExecutionModelJson] = useState('');",
              "  const [maxDurationSeconds, setMaxDurationSeconds] = useState('1800');\n  const [acknowledgeUnknownCost, setAcknowledgeUnknownCost] = useState(false);\n  const [executionModelJson, setExecutionModelJson] = useState('');",
              1,
          )
          selection_anchor = '''  const selectedVersion = versions.find((entry) => entry.version.id === strategyVersionId) ?? versions[0];'''
          selection_insert = '''  const selectedProviderRoutes = (capabilities.data?.providers ?? []).filter((route) =>\n    selectedModels.includes(`${route.provider}:${route.model}`),\n  );\n  const hasUnknownCost = selectedProviderRoutes.some((route) => route.costStatus === 'unknown');\n  const selectedVersion = versions.find((entry) => entry.version.id === strategyVersionId) ?? versions[0];'''
          if selection_anchor not in panel: raise SystemExit('selected version anchor missing')
          panel = panel.replace(selection_anchor, selection_insert, 1)
          panel = panel.replace(
              '''        maxRounds: 2,\n        idempotencyKey: crypto.randomUUID(),''',
              '''        maxRounds: 2,\n        acknowledgeUnknownCost: !hasUnknownCost || acknowledgeUnknownCost,\n        idempotencyKey: crypto.randomUUID(),''',
              1,
          )
          model_ui_anchor = '''          <div className="space-y-2">\n            <div className="text-sm text-muted-foreground">允许 AI 修改的参数</div>'''
          warning = '''          {hasUnknownCost ? (\n            <div className="space-y-2 rounded-md border border-amber-500/40 bg-amber-500/5 p-3">\n              <div className="text-sm font-medium">所选模型存在未知费用</div>\n              <p className="text-xs text-muted-foreground">系统仍会限制调用、Token、回测和计算时长，但没有价格表时不能保证费用上限。</p>\n              <Button\n                type="button"\n                size="sm"\n                variant={acknowledgeUnknownCost ? 'default' : 'outline'}\n                onClick={() => setAcknowledgeUnknownCost((current) => !current)}\n              >\n                {acknowledgeUnknownCost ? '已确认未知费用' : '确认后允许创建'}\n              </Button>\n            </div>\n          ) : null}\n'''
          if model_ui_anchor not in panel: raise SystemExit('parameter section anchor missing')
          panel = panel.replace(model_ui_anchor, warning + model_ui_anchor, 1)
          panel = panel.replace(
              '''<div className="text-xs text-muted-foreground">AI {experiment.aiCallsUsed} 次 · 回测 {experiment.backtestRunsUsed} 次 · Token {experiment.inputTokensUsed}/{experiment.outputTokensUsed} · 成本 {String(experiment.costUsed)}</div>''',
              '''<div className="text-xs text-muted-foreground">AI {experiment.aiCallsUsed} 次 · 回测 {experiment.backtestRunsUsed} 次 · Token {experiment.inputTokensUsed}/{experiment.outputTokensUsed} · {experiment.modelConfig.some((route) => route.costStatus === 'unknown') ? '成本 未知' : `成本 ${String(experiment.costUsed)}`}</div>''',
              1,
          )
          panel = panel.replace(
              '''            <Button disabled={createMutation.isPending || !capabilities.data?.aiOptimizationEnabled} onClick={() => createMutation.mutate()}>{createMutation.isPending ? '创建中…' : '创建优化实验'}</Button>''',
              '''            <Button disabled={createMutation.isPending || !capabilities.data?.aiOptimizationEnabled || (hasUnknownCost && !acknowledgeUnknownCost)} onClick={() => createMutation.mutate()}>{createMutation.isPending ? '创建中…' : '创建优化实验'}</Button>''',
              1,
          )
          panel_path.write_text(panel)

          # Config test covers pricing metadata parsing.
          test_path = Path('apps/server/test/ai/configured-providers.test.ts')
          test = test_path.read_text()
          test = test.replace(
              "{ id: 'alpha', baseUrl: 'https://alpha.example/v1', apiKey: 'a', models: ['a1', 'a2'] },",
              "{ id: 'alpha', baseUrl: 'https://alpha.example/v1', apiKey: 'a', models: ['a1', 'a2'], costPer1kInput: 0.1, costPer1kOutput: 0.2, costCurrency: 'USD', pricingVersion: '2026-09' },",
              1,
          )
          test = test.replace(
              '''    expect(createConfiguredAiProviders(config).map(({ id, models }) => ({ id, models: [...models] }))).toEqual([\n      { id: 'alpha', models: ['a1', 'a2'] },\n      { id: 'beta', models: ['b1'] },\n    ]);''',
              '''    const providers = createConfiguredAiProviders(config);\n    expect(providers.map(({ id, models }) => ({ id, models: [...models] }))).toEqual([\n      { id: 'alpha', models: ['a1', 'a2'] },\n      { id: 'beta', models: ['b1'] },\n    ]);\n    expect(providers[0]?.metadata).toMatchObject({\n      costPer1kInput: 0.1,\n      costPer1kOutput: 0.2,\n      costCurrency: 'USD',\n      pricingVersion: '2026-09',\n    });''',
              1,
          )
          test_path.write_text(test)
          PY
      - name: Remove workflow and commit
        shell: bash
        run: |
          rm .github/workflows/tmp-strategy-cost-accounting.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: make optimization model costs auditable"
          git push origin HEAD:feat/strategy-risk-ai-optimization-20260911
