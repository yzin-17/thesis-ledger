name: Desktop refactor helper

on:
  push:
    branches:
      - refactor/desktop-features
    paths:
      - scripts/refactor-desktop-pr08.py
      - .github/workflows/desktop-refactor-helper.yml

permissions:
  contents: write

jobs:
  refactor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/desktop-features
      - name: Apply deterministic refactor
        run: python3 scripts/refactor-desktop-pr08.py
      - name: Commit generated refactor
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            apps/desktop/src/ui/App.tsx \
            apps/desktop/src/ui/MarketDataSettings.tsx \
            apps/desktop/src/ui/styles.css \
            apps/desktop/src/features/legacy-pages.tsx \
            apps/desktop/src/styles/base.css \
            apps/desktop/src/styles/tokens.css
          git diff --cached --quiet && exit 0
          git commit -m "refactor: split desktop app features"
          git push origin HEAD:refactor/desktop-features
