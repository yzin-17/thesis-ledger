name: Temporary Strategy Optimization Cleanup

on:
  push:
    branches:
      - feat/strategy-risk-ai-optimization-20260911

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/strategy-risk-ai-optimization-20260911
      - name: Remove stale parameters
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          path = Path('apps/server/src/strategy-optimization/strategy-optimization-candidate.service.ts')
          text = path.read_text()
          old = '''    return this.completeProposal(\n      experiment,\n      baseline,\n      descriptors,\n      route,\n      round,\n      modelKey,'''
          new = '''    return this.completeProposal(\n      experiment,\n      route,\n      round,\n      modelKey,'''
          if old not in text: raise SystemExit('call signature snippet missing')
          text = text.replace(old, new, 1)
          old = '''  private async completeProposal(\n    experiment: ExperimentRow,\n    baseline: StrategyVersionRecord & { strategy: StrategySchemaV2 },\n    descriptors: StrategyParameterDescriptor[],\n    route: { provider: string; model: string },'''
          new = '''  private async completeProposal(\n    experiment: ExperimentRow,\n    route: { provider: string; model: string },'''
          if old not in text: raise SystemExit('method signature snippet missing')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Remove workflow and commit
        shell: bash
        run: |
          rm .github/workflows/tmp-strategy-optimization-cleanup.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: clean optimization proposal signature"
          git push origin HEAD:feat/strategy-risk-ai-optimization-20260911
