name: Temporary Strategy Optimization Budget Completion

on:
  push:
    branches:
      - feat/strategy-risk-ai-optimization-20260911

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/strategy-risk-ai-optimization-20260911
      - name: Complete quota budgets and fair scheduling
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str, count: int = 1):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'missing snippet in {path}: {old[:140]!r}')
              p.write_text(text.replace(old, new, count))

          # Contract: token budgets plus worst-case reserve for all model channels and final verification.
          replace(
              'packages/schemas/src/strategy-optimization.ts',
              '''    maxBacktestRuns: z.number().int().min(2).max(100),\n    maxCost: nonNegativeDecimalStringSchema.optional(),\n    maxDurationSeconds: z.number().int().min(30).max(86_400).default(1_800),''',
              '''    maxBacktestRuns: z.number().int().min(2).max(100),\n    maxInputTokens: z.number().int().min(1).max(10_000_000).default(100_000),\n    maxOutputTokens: z.number().int().min(1).max(2_000_000).default(20_000),\n    maxCost: nonNegativeDecimalStringSchema.optional(),\n    maxDurationSeconds: z.number().int().min(30).max(86_400).default(1_800),''',
          )
          schema_path = Path('packages/schemas/src/strategy-optimization.ts')
          schema = schema_path.read_text()
          marker = '''    if (new Set(value.allowedParameterIds).size !== value.allowedParameterIds.length)\n      ctx.addIssue({ code: 'custom', path: ['allowedParameterIds'], message: '参数授权不得重复' });\n    const splitStart = value.split.development.start;'''
          insert = '''    if (new Set(value.allowedParameterIds).size !== value.allowedParameterIds.length)\n      ctx.addIssue({ code: 'custom', path: ['allowedParameterIds'], message: '参数授权不得重复' });\n    const plannedAiCalls = value.models.length * value.maxRounds;\n    const plannedBacktestRuns = 3 + value.models.length * (value.maxRounds * 2 + 1);\n    if (value.budget.maxAiCalls < plannedAiCalls)\n      ctx.addIssue({\n        code: 'custom',\n        path: ['budget', 'maxAiCalls'],\n        message: `AI 调用预算至少需要 ${plannedAiCalls} 次以保证各模型同额度`,\n      });\n    if (value.budget.maxBacktestRuns < plannedBacktestRuns)\n      ctx.addIssue({\n        code: 'custom',\n        path: ['budget', 'maxBacktestRuns'],\n        message: `回测预算至少需要 ${plannedBacktestRuns} 次以预留最终验证`,\n      });\n    const splitStart = value.split.development.start;'''
          if marker not in schema: raise SystemExit('schema budget refine marker missing')
          schema_path.write_text(schema.replace(marker, insert, 1))

          replace(
              'packages/schemas/test/strategy-optimization.test.ts',
              '  budget: { maxAiCalls: 6, maxBacktestRuns: 12, maxDurationSeconds: 1800 },',
              '  budget: { maxAiCalls: 6, maxBacktestRuns: 13, maxDurationSeconds: 1800 },',
          )
          tests_path = Path('packages/schemas/test/strategy-optimization.test.ts')
          tests = tests_path.read_text()
          marker = "\n  it('rejects duplicate proposal parameters and unknown fields', () => {"
          added = '''\n  it('reserves symmetric model work and final verification before starting', () => {\n    expect(() =>\n      optimizationExperimentCreateSchema.parse({\n        ...experiment,\n        budget: { ...experiment.budget, maxAiCalls: 3 },\n      }),\n    ).toThrow(/至少需要 4 次/);\n    expect(() =>\n      optimizationExperimentCreateSchema.parse({\n        ...experiment,\n        budget: { ...experiment.budget, maxBacktestRuns: 12 },\n      }),\n    ).toThrow(/至少需要 13 次/);\n  });\n'''
          if marker not in tests: raise SystemExit('schema tests marker missing')
          tests_path.write_text(tests.replace(marker, added + marker, 1))

          # Provider contract: optional output cap. OpenAI-compatible adapters pass it through.
          replace(
              'apps/server/src/ai/contracts.ts',
              '    input: { model: string; messages: unknown[]; tools: string[] },',
              '    input: { model: string; messages: unknown[]; tools: string[]; maxOutputTokens?: number },',
          )
          replace(
              'apps/server/src/ai/provider-adapters.ts',
              '''type CompletionInput = {\n  model: string;\n  messages: unknown[];\n  tools: string[];\n};''',
              '''type CompletionInput = {\n  model: string;\n  messages: unknown[];\n  tools: string[];\n  maxOutputTokens?: number;\n};''',
          )
          replace(
              'apps/server/src/ai/provider-adapters.ts',
              '''        tools: input.tools.map((name) => ({ type: 'function', function: { name } })),\n        response_format: { type: 'json_object' },''',
              '''        tools: input.tools.map((name) => ({ type: 'function', function: { name } })),\n        response_format: { type: 'json_object' },\n        ...(input.maxOutputTokens === undefined ? {} : { max_tokens: input.maxOutputTokens }),''',
          )

          # Persist token reservation/settlement counters.
          replace(
              'apps/server/prisma/migrations/20260911170000_strategy_risk_ai_optimization/migration.sql',
              '''  "aiCallsUsed" INTEGER NOT NULL DEFAULT 0,\n  "backtestRunsUsed" INTEGER NOT NULL DEFAULT 0,\n  "pausedDurationMs" INTEGER NOT NULL DEFAULT 0 CHECK ("pausedDurationMs" >= 0),''',
              '''  "aiCallsUsed" INTEGER NOT NULL DEFAULT 0,\n  "backtestRunsUsed" INTEGER NOT NULL DEFAULT 0,\n  "inputTokensUsed" INTEGER NOT NULL DEFAULT 0 CHECK ("inputTokensUsed" >= 0),\n  "outputTokensUsed" INTEGER NOT NULL DEFAULT 0 CHECK ("outputTokensUsed" >= 0),\n  "pausedDurationMs" INTEGER NOT NULL DEFAULT 0 CHECK ("pausedDurationMs" >= 0),''',
          )
          replace(
              'apps/server/src/strategy-optimization/strategy-optimization-common.ts',
              '''  aiCallsUsed: number;\n  backtestRunsUsed: number;\n  pausedDurationMs: number;''',
              '''  aiCallsUsed: number;\n  backtestRunsUsed: number;\n  inputTokensUsed: number;\n  outputTokensUsed: number;\n  pausedDurationMs: number;''',
          )

          # Atomic pre-reservation and post-call settlement of token usage.
          run_path = Path('apps/server/src/strategy-optimization/strategy-optimization-run.service.ts')
          run = run_path.read_text()
          old = '''    input: { aiCalls?: number; backtestRuns?: number; estimatedCost?: number },\n  ) {\n    const aiCalls = input.aiCalls ?? 0;\n    const runs = input.backtestRuns ?? 0;\n    const estimatedCost = input.estimatedCost ?? 0;'''
          new = '''    input: {\n      aiCalls?: number;\n      backtestRuns?: number;\n      inputTokens?: number;\n      outputTokens?: number;\n      estimatedCost?: number;\n    },\n  ) {\n    const aiCalls = input.aiCalls ?? 0;\n    const runs = input.backtestRuns ?? 0;\n    const inputTokens = input.inputTokens ?? 0;\n    const outputTokens = input.outputTokens ?? 0;\n    const estimatedCost = input.estimatedCost ?? 0;'''
          if old not in run: raise SystemExit('reserveBudget signature missing')
          run = run.replace(old, new, 1)
          old = '''      SET "aiCallsUsed"="aiCallsUsed"+${aiCalls}, "backtestRunsUsed"="backtestRunsUsed"+${runs},\n          "costUsed"="costUsed"+${estimatedCost}, "updatedAt"=CURRENT_TIMESTAMP'''
          new = '''      SET "aiCallsUsed"="aiCallsUsed"+${aiCalls}, "backtestRunsUsed"="backtestRunsUsed"+${runs},\n          "inputTokensUsed"="inputTokensUsed"+${inputTokens},\n          "outputTokensUsed"="outputTokensUsed"+${outputTokens},\n          "costUsed"="costUsed"+${estimatedCost}, "updatedAt"=CURRENT_TIMESTAMP'''
          if old not in run: raise SystemExit('reserveBudget SET missing')
          run = run.replace(old, new, 1)
          old = '''        AND "aiCallsUsed"+${aiCalls} <= (("budget"->>'maxAiCalls')::int)\n        AND "backtestRunsUsed"+${runs} <= (("budget"->>'maxBacktestRuns')::int)\n        AND (("budget"->>'maxCost') IS NULL OR "costUsed"+${estimatedCost} <= (("budget"->>'maxCost')::decimal))'''
          new = '''        AND "aiCallsUsed"+${aiCalls} <= (("budget"->>'maxAiCalls')::int)\n        AND "backtestRunsUsed"+${runs} <= (("budget"->>'maxBacktestRuns')::int)\n        AND "inputTokensUsed"+${inputTokens} <= (("budget"->>'maxInputTokens')::int)\n        AND "outputTokensUsed"+${outputTokens} <= (("budget"->>'maxOutputTokens')::int)\n        AND (("budget"->>'maxCost') IS NULL OR "costUsed"+${estimatedCost} <= (("budget"->>'maxCost')::decimal))'''
          if old not in run: raise SystemExit('reserveBudget limits missing')
          run = run.replace(old, new, 1)
          reconcile_anchor = '''  async reconcileCost(id: string, estimated: number, actual: number) {'''
          methods = '''  conservativeInputTokenReservation(messages: unknown[]) {\n    return Buffer.byteLength(JSON.stringify(messages), 'utf8');\n  }\n\n  outputTokenReservation(experiment: ExperimentRow) {\n    const budget = toRecord(experiment.budget);\n    const maxOutputTokens =\n      typeof budget.maxOutputTokens === 'number' ? budget.maxOutputTokens : 20_000;\n    const maxAiCalls = typeof budget.maxAiCalls === 'number' ? budget.maxAiCalls : 1;\n    return Math.max(1, Math.floor(maxOutputTokens / Math.max(1, maxAiCalls)));\n  }\n\n  async reconcileTokenUsage(\n    id: string,\n    reservedInput: number,\n    reservedOutput: number,\n    actualInput: number,\n    actualOutput: number,\n  ) {\n    const inputDelta = actualInput - reservedInput;\n    const outputDelta = actualOutput - reservedOutput;\n    const rows = await this.prisma.$queryRaw<\n      Array<{ inputTokensUsed: number; outputTokensUsed: number; budget: unknown }>\n    >(Prisma.sql`\n      UPDATE "OptimizationExperiment"\n      SET "inputTokensUsed"="inputTokensUsed"+${inputDelta},\n          "outputTokensUsed"="outputTokensUsed"+${outputDelta},\n          "updatedAt"=CURRENT_TIMESTAMP\n      WHERE "id"=${id}::uuid\n      RETURNING "inputTokensUsed", "outputTokensUsed", "budget"\n    `);\n    const row = rows[0];\n    if (!row) return;\n    const budget = toRecord(row.budget);\n    const maxInput = typeof budget.maxInputTokens === 'number' ? budget.maxInputTokens : 0;\n    const maxOutput = typeof budget.maxOutputTokens === 'number' ? budget.maxOutputTokens : 0;\n    if (row.inputTokensUsed > maxInput || row.outputTokensUsed > maxOutput)\n      throw new BadRequestException('Provider 实际 token 用量超过预留预算，已停止新任务');\n  }\n\n'''
          if reconcile_anchor not in run: raise SystemExit('reconcileCost anchor missing')
          run = run.replace(reconcile_anchor, methods + reconcile_anchor, 1)
          run_path.write_text(run)

          # Build the prompt before reservation; reserve a conservative input upper bound and a per-call output cap.
          candidate_path = Path('apps/server/src/strategy-optimization/strategy-optimization-candidate.service.ts')
          candidate = candidate_path.read_text()
          old = '''    const modelKey = `${route.provider}:${route.model}`;\n    const estimatedCost = 0;\n    await this.runs.reserveBudget(experiment.id, { aiCalls: 1, estimatedCost });\n    const aiRun = await this.aiRuns.start('''
          new = '''    const modelKey = `${route.provider}:${route.model}`;\n    const estimatedCost = 0;\n    const messages = await this.prompt(experiment, baseline.strategy, descriptors, modelKey, round);\n    const inputTokenReservation = this.runs.conservativeInputTokenReservation(messages);\n    const outputTokenReservation = this.runs.outputTokenReservation(experiment);\n    await this.runs.reserveBudget(experiment.id, {\n      aiCalls: 1,\n      inputTokens: inputTokenReservation,\n      outputTokens: outputTokenReservation,\n      estimatedCost,\n    });\n    const aiRun = await this.aiRuns.start('''
          if old not in candidate: raise SystemExit('candidate reservation block missing')
          candidate = candidate.replace(old, new, 1)
          old = '''      aiRun.id,\n      estimatedCost,\n    );'''
          new = '''      aiRun.id,\n      estimatedCost,\n      messages,\n      inputTokenReservation,\n      outputTokenReservation,\n    );'''
          if old not in candidate: raise SystemExit('candidate completeProposal call missing')
          candidate = candidate.replace(old, new, 1)
          old = '''    aiRunId: string,\n    estimatedCost: number,\n  ) {'''
          new = '''    aiRunId: string,\n    estimatedCost: number,\n    messages: unknown[],\n    inputTokenReservation: number,\n    outputTokenReservation: number,\n  ) {'''
          if old not in candidate: raise SystemExit('completeProposal signature missing')
          candidate = candidate.replace(old, new, 1)
          old = '''          messages: await this.prompt(\n            experiment,\n            baseline.strategy,\n            descriptors,\n            modelKey,\n            round,\n          ),\n          tools: [],'''
          new = '''          messages,\n          tools: [],\n          maxOutputTokens: outputTokenReservation,'''
          if old not in candidate: raise SystemExit('provider prompt block missing')
          candidate = candidate.replace(old, new, 1)
          old = '''      const proposal = optimizationProposalSchema.parse(completion.content);\n      await this.prisma.aiRun.update({\n        where: { id: aiRunId },\n        data: {\n          status: 'succeeded',\n          result: asJson(proposal),\n          inputTokens: completion.inputTokens,\n          outputTokens: completion.outputTokens,\n          cost: completion.cost,\n          durationMs: Date.now() - startedAt,\n          completedAt: new Date(),\n          modelMetadata: asJson({'''
          new = '''      await this.prisma.aiRun.update({\n        where: { id: aiRunId },\n        data: {\n          inputTokens: completion.inputTokens,\n          outputTokens: completion.outputTokens,\n          cost: completion.cost,\n          durationMs: Date.now() - startedAt,\n          modelMetadata: asJson({'''
          if old not in candidate: raise SystemExit('AiRun success block start missing')
          candidate = candidate.replace(old, new, 1)
          old = '''          }),\n        },\n      });\n      await this.runs.reconcileCost(experiment.id, estimatedCost, completion.cost);\n      return { proposal, aiRunId, modelKey };'''
          new = '''          }),\n        },\n      });\n      await this.runs.reconcileTokenUsage(\n        experiment.id,\n        inputTokenReservation,\n        outputTokenReservation,\n        completion.inputTokens,\n        completion.outputTokens,\n      );\n      await this.runs.reconcileCost(experiment.id, estimatedCost, completion.cost);\n      const proposal = optimizationProposalSchema.parse(completion.content);\n      await this.prisma.aiRun.update({\n        where: { id: aiRunId },\n        data: { status: 'succeeded', result: asJson(proposal), completedAt: new Date() },\n      });\n      return { proposal, aiRunId, modelKey };'''
          if old not in candidate: raise SystemExit('AiRun success block end missing')
          candidate_path.write_text(candidate.replace(old, new, 1))

          # Fair scheduling: one round per channel before any channel advances to the next round.
          service_path = Path('apps/server/src/strategy-optimization/strategy-optimization.service.ts')
          service = service_path.read_text()
          old = '''  private async processModelRounds(\n    experiment: ExperimentRow,\n    baseline: StrategyVersionRecord & { strategy: StrategySchemaV2 },\n  ) {\n    const descriptors = describeStrategyParameters(baseline.strategy);\n    const routes = experiment.modelConfig as Array<{ provider: string; model: string }>;\n    for (const route of routes) {\n      const modelKey = `${route.provider}:${route.model}`;\n      let bestScore = Number.NEGATIVE_INFINITY;\n      for (let round = 1; round <= experiment.maxRounds; round += 1) {\n        await this.processRound(experiment, baseline, descriptors, route, round);\n        if (await this.cancelled(experiment.id)) return;\n        const currentBest = await this.bestValidationScore(experiment.id, modelKey);\n        if (round > 1 && currentBest <= bestScore) break;\n        bestScore = Math.max(bestScore, currentBest);\n      }\n    }\n  }'''
          new = '''  private async processModelRounds(\n    experiment: ExperimentRow,\n    baseline: StrategyVersionRecord & { strategy: StrategySchemaV2 },\n  ) {\n    const descriptors = describeStrategyParameters(baseline.strategy);\n    const routes = experiment.modelConfig as Array<{ provider: string; model: string }>;\n    const states = new Map(\n      routes.map((route) => [\n        `${route.provider}:${route.model}`,\n        { bestScore: Number.NEGATIVE_INFINITY, stopped: false },\n      ]),\n    );\n    for (let round = 1; round <= experiment.maxRounds; round += 1) {\n      for (const route of routes) {\n        const modelKey = `${route.provider}:${route.model}`;\n        const state = states.get(modelKey);\n        if (!state || state.stopped) continue;\n        await this.processRound(experiment, baseline, descriptors, route, round);\n        if (await this.cancelled(experiment.id)) return;\n        const currentBest = await this.bestValidationScore(experiment.id, modelKey);\n        if (round > 1 && currentBest <= state.bestScore) state.stopped = true;\n        state.bestScore = Math.max(state.bestScore, currentBest);\n      }\n    }\n  }'''
          if old not in service: raise SystemExit('model rounds block missing')
          service_path.write_text(service.replace(old, new, 1))

          # Desktop exposes token budgets and usage.
          replace(
              'apps/desktop/src/features/strategy/strategy-optimization.api.ts',
              '''  aiCallsUsed: number;\n  backtestRunsUsed: number;\n  costUsed: string | number;''',
              '''  aiCallsUsed: number;\n  backtestRunsUsed: number;\n  inputTokensUsed: number;\n  outputTokensUsed: number;\n  costUsed: string | number;''',
          )
          panel_path = Path('apps/desktop/src/features/strategy/StrategyOptimizationExperimentPanel.tsx')
          panel = panel_path.read_text()
          panel = panel.replace(
              "  const [maxBacktestRuns, setMaxBacktestRuns] = useState('20');\n  const [maxDurationSeconds, setMaxDurationSeconds] = useState('1800');",
              "  const [maxBacktestRuns, setMaxBacktestRuns] = useState('20');\n  const [maxInputTokens, setMaxInputTokens] = useState('100000');\n  const [maxOutputTokens, setMaxOutputTokens] = useState('20000');\n  const [maxDurationSeconds, setMaxDurationSeconds] = useState('1800');",
              1,
          )
          panel = panel.replace(
              '''          maxBacktestRuns: Number(maxBacktestRuns),\n          maxDurationSeconds: Number(maxDurationSeconds),''',
              '''          maxBacktestRuns: Number(maxBacktestRuns),\n          maxInputTokens: Number(maxInputTokens),\n          maxOutputTokens: Number(maxOutputTokens),\n          maxDurationSeconds: Number(maxDurationSeconds),''',
              1,
          )
          old = '''          <div className="grid gap-3 sm:grid-cols-3">\n            <label className="space-y-1 text-sm"><span className="text-muted-foreground">AI 调用上限</span><Input type="number" min="1" max="30" value={maxAiCalls} onChange={(event) => setMaxAiCalls(event.target.value)} /></label>\n            <label className="space-y-1 text-sm"><span className="text-muted-foreground">回测运行上限</span><Input type="number" min="2" max="100" value={maxBacktestRuns} onChange={(event) => setMaxBacktestRuns(event.target.value)} /></label>\n            <label className="space-y-1 text-sm"><span className="text-muted-foreground">最长计算（秒）</span><Input type="number" min="30" max="86400" value={maxDurationSeconds} onChange={(event) => setMaxDurationSeconds(event.target.value)} /></label>\n          </div>\n          <p className="text-xs text-muted-foreground">预算为服务端硬上限；达到调用、回测、费用或时长上限后停止创建新工作。</p>'''
          new = '''          <div className="grid gap-3 sm:grid-cols-2 lg:grid-cols-5">\n            <label className="space-y-1 text-sm"><span className="text-muted-foreground">AI 调用上限</span><Input type="number" min="1" max="30" value={maxAiCalls} onChange={(event) => setMaxAiCalls(event.target.value)} /></label>\n            <label className="space-y-1 text-sm"><span className="text-muted-foreground">回测运行上限</span><Input type="number" min="2" max="100" value={maxBacktestRuns} onChange={(event) => setMaxBacktestRuns(event.target.value)} /></label>\n            <label className="space-y-1 text-sm"><span className="text-muted-foreground">输入 Token</span><Input type="number" min="1" max="10000000" value={maxInputTokens} onChange={(event) => setMaxInputTokens(event.target.value)} /></label>\n            <label className="space-y-1 text-sm"><span className="text-muted-foreground">输出 Token</span><Input type="number" min="1" max="2000000" value={maxOutputTokens} onChange={(event) => setMaxOutputTokens(event.target.value)} /></label>\n            <label className="space-y-1 text-sm"><span className="text-muted-foreground">最长计算（秒）</span><Input type="number" min="30" max="86400" value={maxDurationSeconds} onChange={(event) => setMaxDurationSeconds(event.target.value)} /></label>\n          </div>\n          <p className="text-xs text-muted-foreground">预算为服务端硬上限；模型调用前预留保守输入 Token 与单次输出额度，完成后按 Provider 实际 usage 结算。</p>'''
          if old not in panel: raise SystemExit('Desktop budget UI block missing')
          panel = panel.replace(old, new, 1)
          panel = panel.replace(
              '''<div className="text-xs text-muted-foreground">AI {experiment.aiCallsUsed} 次 · 回测 {experiment.backtestRunsUsed} 次 · 成本 {String(experiment.costUsed)}</div>''',
              '''<div className="text-xs text-muted-foreground">AI {experiment.aiCallsUsed} 次 · 回测 {experiment.backtestRunsUsed} 次 · Token {experiment.inputTokensUsed}/{experiment.outputTokensUsed} · 成本 {String(experiment.costUsed)}</div>''',
              1,
          )
          panel_path.write_text(panel)
          PY
      - name: Remove temporary workflow and commit
        shell: bash
        run: |
          rm .github/workflows/tmp-strategy-optimization-budget.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: enforce fair optimization token budgets"
          git push origin HEAD:feat/strategy-risk-ai-optimization-20260911
