name: Temporary Strategy Finalization Retry Repair

on:
  push:
    branches:
      - feat/strategy-risk-ai-optimization-20260911

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/strategy-risk-ai-optimization-20260911
      - name: Repair sealed-test retry semantics
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str, count: int = 1):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'missing snippet in {path}: {old[:140]!r}')
              p.write_text(text.replace(old, new, count))

          # Reuse the same V2 Run/Snapshot for recoverable infrastructure retry.
          run_path = Path('apps/server/src/strategy-optimization/strategy-optimization-run.service.ts')
          run = run_path.read_text()
          old = '''    const run = await this.backtests.createRun({\n      strategyVersionId,\n      runConfig: this.runConfigForSplit(experiment, splitName),\n      idempotencyKey: `optimization:${experiment.id}:${identity}:${splitName}`,\n    });\n    if (!run) throw new Error('V2 Run 创建后未找到持久化记录');\n    if (run.status === 'queued') await this.backtests.runV2(run.id);\n    const terminal = ['succeeded', 'failed', 'cancelled'].includes(run.status)\n      ? run\n      : await this.waitForRun(run.id, this.requestTimeoutMs(experiment, 180_000));'''
          new = '''    let run = await this.backtests.createRun({\n      strategyVersionId,\n      runConfig: this.runConfigForSplit(experiment, splitName),\n      idempotencyKey: `optimization:${experiment.id}:${identity}:${splitName}`,\n    });\n    if (!run) throw new Error('V2 Run 创建后未找到持久化记录');\n    if (run.status === 'failed' && run.errorCode === 'INTERNAL_ERROR') {\n      run = await this.backtests.retryRun(run.id);\n      if (!run) throw new Error('V2 Run retry 后未找到持久化记录');\n    }\n    if (run.status === 'queued') await this.backtests.runV2(run.id);\n    const terminal = ['succeeded', 'failed', 'cancelled'].includes(run.status)\n      ? run\n      : await this.waitForRun(run.id, this.requestTimeoutMs(experiment, 180_000));'''
          if old not in run: raise SystemExit('executeRun block missing')
          run_path.write_text(run.replace(old, new, 1))

          service_path = Path('apps/server/src/strategy-optimization/strategy-optimization.service.ts')
          service = service_path.read_text()

          # Allow retry to reuse candidates that already finished their sealed test.
          service = service.replace(
              "    if (selected.some((candidate) => candidate.validationStatus !== 'valid'))\n      throw new BadRequestException('只有开发/验证均通过的候选可以进入封存测试');",
              "    if (\n      selected.some(\n        (candidate) => !['valid', 'test_valid', 'test_invalid'].includes(candidate.validationStatus),\n      )\n    )\n      throw new BadRequestException('只有开发/验证均通过的候选可以进入封存测试');",
              1,
          )

          old_lock = '''  private async lockFinalization(\n    experiment: ExperimentRow,\n    candidateIds: string[],\n    selectedCandidateId: string,\n  ) {\n    const updated = await this.prisma.$executeRaw(Prisma.sql`\n      UPDATE "OptimizationExperiment"\n      SET "status"='testing', "stage"='testing', "lockedCandidateIds"=${JSON.stringify(candidateIds)}::jsonb,\n          "selectedCandidateId"=${selectedCandidateId}::uuid, "leaseUntil"=${new Date(Date.now() + 3_600_000)},\n          "pausedDurationMs"="pausedDurationMs" + GREATEST(0, FLOOR(EXTRACT(EPOCH FROM (CURRENT_TIMESTAMP - "updatedAt")) * 1000))::int,\n          "updatedAt"=CURRENT_TIMESTAMP\n      WHERE "id"=${experiment.id}::uuid AND "stage"='awaiting_finalization' AND "cancelRequestedAt" IS NULL\n    `);\n    if (updated !== 1) throw new BadRequestException('实验封存状态发生并发变化');\n  }'''
          new_lock = '''  private assertSameFinalizationLock(\n    experiment: ExperimentRow,\n    candidateIds: string[],\n    selectedCandidateId: string,\n  ) {\n    const existing = Array.isArray(experiment.lockedCandidateIds)\n      ? experiment.lockedCandidateIds.filter((item): item is string => typeof item === 'string')\n      : [];\n    if (existing.length === 0) return;\n    const requested = [...candidateIds].sort();\n    const locked = [...existing].sort();\n    if (JSON.stringify(requested) !== JSON.stringify(locked) || experiment.selectedCandidateId !== selectedCandidateId)\n      throw new BadRequestException('测试集已开始访问，只允许对原锁定候选进行技术重试');\n  }\n\n  private async lockFinalization(\n    experiment: ExperimentRow,\n    candidateIds: string[],\n    selectedCandidateId: string,\n  ) {\n    this.assertSameFinalizationLock(experiment, candidateIds, selectedCandidateId);\n    const updated = await this.prisma.$executeRaw(Prisma.sql`\n      UPDATE "OptimizationExperiment"\n      SET "status"='testing', "stage"='testing', "lockedCandidateIds"=${JSON.stringify(candidateIds)}::jsonb,\n          "selectedCandidateId"=${selectedCandidateId}::uuid, "leaseUntil"=${new Date(Date.now() + 3_600_000)},\n          "pausedDurationMs"="pausedDurationMs" + GREATEST(0, FLOOR(EXTRACT(EPOCH FROM (CURRENT_TIMESTAMP - "updatedAt")) * 1000))::int,\n          "testExposedAt"=COALESCE("testExposedAt", CURRENT_TIMESTAMP),\n          "exposure"=COALESCE("exposure", '{}'::jsonb) || ${JSON.stringify({ testAccessStarted: true, lockedCandidateIds: candidateIds, preselectedCandidateId: selectedCandidateId })}::jsonb,\n          "stopReason"=NULL, "updatedAt"=CURRENT_TIMESTAMP\n      WHERE "id"=${experiment.id}::uuid AND "stage"='awaiting_finalization' AND "cancelRequestedAt" IS NULL\n    `);\n    if (updated !== 1) throw new BadRequestException('实验封存状态发生并发变化');\n  }'''
          if old_lock not in service: raise SystemExit('lockFinalization block missing')
          service = service.replace(old_lock, new_lock, 1)

          # Reuse already completed baseline/candidate sealed results on a technical retry.
          old = '''  private async finalBaseline(experiment: ExperimentRow) {\n    const run = await this.runs.executeRun('''
          new = '''  private async finalBaseline(experiment: ExperimentRow) {\n    const existingFingerprint = toRecord(experiment.frozenDataFingerprints).test;\n    const existingRunId = toRecord(experiment.baselineRunRefs).test;\n    if (typeof existingFingerprint === 'string' && typeof existingRunId === 'string')\n      return existingFingerprint;\n    const run = await this.runs.executeRun('''
          if old not in service: raise SystemExit('finalBaseline anchor missing')
          service = service.replace(old, new, 1)
          old = '''  private async finalCandidate(experiment: ExperimentRow, candidate: CandidateRow, fingerprint: string) {\n    const run = await this.runs.executeRun('''
          new = '''  private async finalCandidate(experiment: ExperimentRow, candidate: CandidateRow, fingerprint: string) {\n    const existingRunId = toRecord(candidate.runRefs).test;\n    if (\n      typeof existingRunId === 'string' &&\n      ['test_valid', 'test_invalid'].includes(candidate.validationStatus)\n    )\n      return;\n    const run = await this.runs.executeRun('''
          if old not in service: raise SystemExit('finalCandidate anchor missing')
          service = service.replace(old, new, 1)

          # Preserve initial exposure metadata instead of overwriting it at completion.
          old = '''      SET "status"='succeeded', "stage"='completed', "testExposedAt"=CURRENT_TIMESTAMP,\n          "exposure"=${JSON.stringify({ testRevealed: true, lockedCandidateIds: candidateIds, preselectedCandidateId: selectedCandidateId })}::jsonb,\n          "leaseUntil"=NULL, "updatedAt"=CURRENT_TIMESTAMP'''
          new = '''      SET "status"='succeeded', "stage"='completed', "testExposedAt"=COALESCE("testExposedAt", CURRENT_TIMESTAMP),\n          "exposure"=COALESCE("exposure", '{}'::jsonb) || ${JSON.stringify({ testRevealed: true, lockedCandidateIds: candidateIds, preselectedCandidateId: selectedCandidateId })}::jsonb,\n          "leaseUntil"=NULL, "stopReason"=NULL, "updatedAt"=CURRENT_TIMESTAMP'''
          if old not in service: raise SystemExit('completeFinalization block missing')
          service = service.replace(old, new, 1)

          # Infrastructure failure returns to the same locked finalization state; deterministic test results remain persisted.
          marker = '''  async finalize(id: string, input: unknown) {'''
          helper = '''  private async releaseFinalizationForRetry(id: string, error: unknown) {\n    await this.prisma.$executeRaw(Prisma.sql`\n      UPDATE "OptimizationExperiment"\n      SET "status"='awaiting_finalization', "stage"='awaiting_finalization', "leaseUntil"=NULL,\n          "stopReason"=${`final_test_retry_required:${redactOptimizationError(error)}`},\n          "updatedAt"=CURRENT_TIMESTAMP\n      WHERE "id"=${id}::uuid AND "status"='testing'\n    `);\n  }\n\n'''
          if marker not in service: raise SystemExit('finalize marker missing')
          service = service.replace(marker, helper + marker, 1)
          service = service.replace(
              '''    } catch (error) {\n      await this.fail(id, redactOptimizationError(error));\n      throw error;\n    }\n  }\n\n  private async previousAdoption''',
              '''    } catch (error) {\n      await this.releaseFinalizationForRetry(id, error);\n      throw error;\n    }\n  }\n\n  private async previousAdoption''',
              1,
          )
          service_path.write_text(service)
          PY
      - name: Remove workflow and commit
        shell: bash
        run: |
          rm .github/workflows/tmp-strategy-finalization-retry.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: make sealed test finalization retry-safe"
          git push origin HEAD:feat/strategy-risk-ai-optimization-20260911
