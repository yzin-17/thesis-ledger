name: Temporary Strategy Finalize Read Fix
on:
  push:
    branches: [feat/strategy-risk-ai-optimization-20260911]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/strategy-risk-ai-optimization-20260911
      - name: Patch finalize read
        run: |
          python <<'PY'
          from pathlib import Path
          p = Path('apps/server/src/strategy-optimization/strategy-optimization.service.ts')
          text = p.read_text()
          old = "import { StrategyOptimizationRunService } from './strategy-optimization-run.service.js';"
          new = "import { StrategyOptimizationReadService } from './strategy-optimization-read.service.js';\nimport { StrategyOptimizationRunService } from './strategy-optimization-run.service.js';"
          if old not in text: raise SystemExit('import anchor missing')
          text = text.replace(old, new, 1)
          old = "    private readonly candidateService: StrategyOptimizationCandidateService,\n    private readonly runs: StrategyOptimizationRunService,"
          new = "    private readonly candidateService: StrategyOptimizationCandidateService,\n    private readonly reads: StrategyOptimizationReadService,\n    private readonly runs: StrategyOptimizationRunService,"
          if old not in text: raise SystemExit('constructor anchor missing')
          text = text.replace(old, new, 1)
          if '      return this.compare(id);' not in text: raise SystemExit('finalize compare missing')
          text = text.replace('      return this.compare(id);', '      return this.reads.compare(id);', 1)
          p.write_text(text)
          PY
      - name: Commit
        run: |
          rm .github/workflows/tmp-strategy-finalize-read.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: route finalize response through optimization read service"
          git push origin HEAD:feat/strategy-risk-ai-optimization-20260911
