name: Apply reviewed AI onboarding source
on:
  pull_request:
    types: [opened, synchronize]
permissions:
  contents: write
jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'codex/ai-provider-auto-test-save'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Verify exact locally tested patch and apply
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, hashlib, lzma, pathlib
          root = pathlib.Path('.github/ai-onboarding-patch')
          encoded = ''.join((root / f'part{i}').read_text() for i in range(4))
          patch = lzma.decompress(base64.b64decode(encoded, validate=True))
          assert hashlib.sha256(patch).hexdigest() == 'd35ecc050961e4404dda7c116e745e103d48e8e025edbd0abd5ad79e6159cdf2'
          pathlib.Path('/tmp/ai-onboarding.patch').write_bytes(patch)
          PY
          git apply --index --unidiff-zero /tmp/ai-onboarding.patch
          git rm -r .github/ai-onboarding-patch
          git rm .github/workflows/ai-onboarding-apply.yml .github/workflows/ai-onboarding-source-snapshot.yml
          git diff --cached --check
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'feat(ai): implement automatic generation selection and verified provider save'
          git push origin HEAD:refs/heads/codex/ai-provider-auto-test-save
