name: Temporary Test Split

on:
  push:
    branches: [refactor/tests-guardrails]
    paths:
      - 'scripts/_split-tests.mjs'
      - '.github/workflows/_tmp-split-tests.yml'
  pull_request:
    branches: [main]
    paths:
      - 'scripts/_split-tests.mjs'
      - '.github/workflows/_tmp-split-tests.yml'
  workflow_dispatch:

concurrency:
  group: temporary-test-split-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  split:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/tests-guardrails
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Split monolithic tests
        run: node scripts/_split-tests.mjs
      - name: Format generated tests
        run: pnpm exec prettier --write apps/server/test packages/domain/test
      - name: Verify focused tests and lint
        run: |
          pnpm --filter @thesis-ledger/domain test
          pnpm --filter @thesis-ledger/server test
          pnpm exec eslint apps/server/test packages/domain/test --max-warnings=0
      - name: Remove temporary helper
        run: |
          rm scripts/_split-tests.mjs
          rm .github/workflows/_tmp-split-tests.yml
      - name: Commit generated split
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- apps/server/test packages/domain/test scripts/_split-tests.mjs .github/workflows/_tmp-split-tests.yml
          git commit -m 'test: split monolithic suites by feature'
          git push origin HEAD:refactor/tests-guardrails
