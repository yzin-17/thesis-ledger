name: Temporary Backtest V2 Task Closure V2

on:
  push:
    branches:
      - fix/backtest-v2-closure-20260911

permissions:
  contents: write

jobs:
  close-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/backtest-v2-closure-20260911
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply final task state
        run: python scripts/tmp_close_backtest_v2_tasks.py
      - name: Build workspace dependencies
        run: |
          pnpm --filter @thesis-ledger/shared build
          pnpm --filter @thesis-ledger/schemas build
          pnpm --filter @thesis-ledger/domain build
          pnpm --filter @thesis-ledger/api-client build
      - name: Targeted acceptance tests
        run: |
          pnpm --filter @thesis-ledger/schemas exec vitest run test/backtest-v2-t13-golden.test.ts test/backtest-v2-t13-matrix.test.ts
          pnpm --filter @thesis-ledger/server exec vitest run test/backtest/v2-snapshot-builder.test.ts test/backtest/snapshot-execution-model.test.ts
          pnpm --filter @thesis-ledger/schemas typecheck
          pnpm --filter @thesis-ledger/server typecheck
          node scripts/check-boundaries.mjs
          git diff --check
      - name: Commit final task state
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/specs/2026-08-28-unified-backtest-v2.md docs/specs/2026-09-10-backtest-historical-execution-rule-facts.md docs/tasks/2026-08-28-unified-backtest-v2.md docs/tasks/2026-09-10-backtest-historical-execution-rule-facts.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "docs: close backtest v2 delivery tasks"
          git push origin HEAD:fix/backtest-v2-closure-20260911
