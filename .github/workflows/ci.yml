name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      package_desktop:
        description: '构建并上传桌面安装包'
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  contracts-and-guardrails:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/thesis_ledger?schema=public
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: thesis_ledger
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d thesis_ledger"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Secret scan
        run: pnpm security:secrets
      - name: Migration matrix
        run: pnpm migration:matrix
      - name: Strategy optimization database smoke
        run: |
          pnpm db:generate
          pnpm db:migrate
          pnpm --filter @thesis-ledger/server exec node scripts/strategy-optimization-db-smoke.mjs
      - name: PostgreSQL service E2E
        run: |
          pnpm --filter @thesis-ledger/schemas build
          pnpm --filter @thesis-ledger/shared build
          pnpm --filter @thesis-ledger/domain build
          pnpm --filter @thesis-ledger/server exec vitest run \
            test/strategy-optimization/strategy-optimization-postgres.integration.test.ts \
            test/strategy-optimization/strategy-optimization-postgres-reconciler.integration.test.ts \
            test/automation/durable-execution-postgres.integration.test.ts
        env:
          RUN_STRATEGY_OPTIMIZATION_POSTGRES_E2E: '1'
          RUN_AUTOMATION_POSTGRES_E2E: '1'
      - name: AI 配置隔离 PostgreSQL
        run: |
          docker pull postgres:17-alpine
          node scripts/test-ai-provider-postgres.mjs
      - name: 基金定投隔离 PostgreSQL
        run: node scripts/test-fund-investment-postgres.mjs
      - name: 组合估值隔离 PostgreSQL
        run: node scripts/test-portfolio-valuation-postgres.mjs
      - name: 收益与风险正确性隔离 PostgreSQL
        run: node scripts/test-performance-correctness-postgres.mjs test/risk/valuation-postgres.integration.test.ts
      - name: 复盘投影隔离 PostgreSQL
        run: node scripts/test-journal-review-postgres.mjs
      - name: Market reader review regressions
        run: |
          market_regression_tests=(
            test/market/market-bar-reader-v3.test.ts
            test/market/market-chart-reader-v3.test.ts
            test/market/market-indicator-window.test.ts
          )
          for test_file in "${market_regression_tests[@]}"; do
            if [ ! -f "apps/server/${test_file}" ]; then
              printf '缺少市场回归文件：%s\n' "${test_file}" >&2
              exit 1
            fi
          done
          pnpm --filter @thesis-ledger/server exec vitest run "${market_regression_tests[@]}"
      - name: Contract tests
        run: pnpm contract:test
      - name: 研究离线轨迹确定性门禁
        run: |
          pnpm --filter @thesis-ledger/server exec vitest run test/ai/research-trace-evaluation.test.ts
          node scripts/evaluate-research-trace.mjs apps/server/test/ai/fixtures/research-trace-v1.samples.json
      - name: Complexity guardrails
        run: pnpm guardrails:complexity
        env:
          GUARDRAIL_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
      - name: Mobile import boundary regressions
        run: node --test scripts/test-mobile-boundaries.mjs
      - name: 手机签名与接续拒绝反例
        run: node --test scripts/mobile-release/*.test.mjs

  mobile-android-native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: pnpm install --frozen-lockfile
      - name: Build Android debug app
        working-directory: apps/mobile/android
        run: ./gradlew :app:assembleDebug --no-daemon

  mobile-ios-native:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install iOS pods from the committed lockfile
        working-directory: apps/mobile/ios
        run: |
          export SDKROOT="$(xcrun --sdk macosx --show-sdk-path)"
          pod install --deployment
      - name: Build iOS Simulator app
        run: >-
          xcodebuild -workspace apps/mobile/ios/ThesisLedger.xcworkspace
          -scheme ThesisLedger -configuration Debug -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath "$RUNNER_TEMP/thesis-ledger-mobile-ios"
          CODE_SIGNING_ALLOWED=NO build

  desktop-packages:
    needs: [quality, contracts-and-guardrails]
    if: (github.event_name == 'workflow_dispatch' && inputs.package_desktop) || startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            package_script: package:mac
            artifact_name: desktop-macos-dmg
          - os: windows-2022
            package_script: package:win
            artifact_name: desktop-windows-nsis
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build Desktop workspace dependencies
        run: pnpm --filter '@thesis-ledger/desktop^...' build
      - name: Build Desktop installer
        shell: bash
        run: |
          for optional in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            if [[ -z "${!optional}" ]]; then
              unset "$optional"
            fi
          done
          pnpm --filter @thesis-ledger/desktop ${{ matrix.package_script }}
        env:
          CSC_LINK: ${{ secrets.DESKTOP_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.DESKTOP_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - name: Verify macOS DMG
        if: runner.os == 'macOS'
        run: |
          hdiutil verify "apps/desktop/release/ThesisLedger-0.1.0-arm64.dmg"
          shasum -a 256 apps/desktop/release/*.dmg
      - name: Verify Windows NSIS installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-ChildItem apps/desktop/release -Filter '*.exe' | Get-FileHash -Algorithm SHA256
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: apps/desktop/release/*
          if-no-files-found: error
